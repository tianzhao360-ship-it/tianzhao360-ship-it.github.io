<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Self restraint">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="manifest" href="/manifest.webmanifest">
<title>Self restraint</title>
<style>
:root{--bg:#f2f2f7;--card:#fff;--text:#1c1c1e;--sub:#8e8e93;--line:#e5e5ea;--fill:#e9e9ef;--accent:#5e5ce6;--ok:#34c759;--warn:#ff9f0a;--over:#ff3b30}
@media (prefers-color-scheme: dark){:root{--bg:#000;--card:#1c1c1e;--text:#f2f2f7;--sub:#98989f;--line:#2c2c2e;--fill:#2c2c2e;--accent:#7d7aff;--ok:#30d158;--warn:#ff9f0a;--over:#ff453a}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 -apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;-webkit-text-size-adjust:100%}
body{padding-top:env(safe-area-inset-top);overscroll-behavior-y:none}
main{padding:4px 16px calc(100px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto}
.page{display:none}.page.on{display:block}
header.top{display:flex;align-items:flex-end;justify-content:space-between;padding:10px 0 14px}
h1{font-size:30px;margin:0;font-weight:800;letter-spacing:-.5px}
h4{margin:22px 4px 6px;font-size:13px;font-weight:500;color:var(--sub)}
p{margin:8px 0}
.card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:12px}
.muted{color:var(--sub);font-size:13px}.xs{font-size:11px}
.big{font-size:42px;font-weight:700;letter-spacing:-1px;font-variant-numeric:tabular-nums;line-height:1.15;margin:2px 0 10px}
.big2{font-size:26px;font-weight:700;margin:4px 0 8px;font-variant-numeric:tabular-nums}
.num{font-size:24px;font-weight:700}
.red{color:var(--over)}.green{color:var(--ok)}
.split{display:flex;justify-content:space-between;align-items:center;gap:8px}
.right{text-align:right}
.lv-ok{--lv:var(--ok)}.lv-warn{--lv:var(--warn)}.lv-over{--lv:var(--over)}.lv-none{--lv:var(--accent)}
.bar{height:10px;border-radius:5px;background:var(--fill);overflow:hidden;margin:6px 0}
.bar.sm{height:6px}
.bar>i{display:block;height:100%;border-radius:inherit;background:var(--lv,var(--accent));transition:width .4s}
.hero.lv-over .big{color:var(--over)}
.tip{margin-top:10px;padding:8px 10px;border-radius:10px;font-size:14px;background:color-mix(in srgb,var(--lv) 14%,transparent)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.mini{background:var(--card);border-radius:14px;padding:12px}
.mini b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.notice{background:color-mix(in srgb,var(--accent) 14%,var(--card));font-size:15px}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:.5px solid var(--line)}
.row:last-child{border-bottom:0}
.ico{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:20px;flex:none}
.mid{flex:1;min-width:0}
.mid>div:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row>b{font-variant-numeric:tabular-nums}
.tag{color:var(--warn)}
.empty{color:var(--sub);text-align:center;padding:22px 8px;font-size:14px}
.alert{display:grid;grid-template-columns:1fr auto;padding-top:10px;font-size:14px}
.alert .bar{grid-column:1/-1}
.dayh{display:flex;justify-content:space-between;color:var(--sub);font-size:13px;margin:16px 4px 6px}
button{font:inherit;color:inherit;cursor:pointer}
.icon{width:38px;height:38px;border:0;border-radius:50%;background:var(--card);display:grid;place-items:center;color:var(--text);font-size:22px}
.icon:disabled{opacity:.3}
.icon svg{width:20px;height:20px}
.link{border:0;background:none;color:var(--accent);padding:6px 4px;font-size:15px}
.link.danger,.danger{color:var(--over)}.link.green{color:var(--ok)}
.btn{border:0;border-radius:10px;background:var(--accent);color:#fff;padding:10px 14px;font-weight:600;white-space:nowrap}
input,select{font:inherit;font-size:16px;color:var(--text);background:var(--fill);border:0;border-radius:10px;padding:10px 12px;width:100%;min-width:0;outline:none;-webkit-appearance:none;appearance:none}
input[type=search]{background:var(--card);margin-bottom:10px}
.seg{display:flex;background:var(--fill);border-radius:10px;padding:2px;gap:2px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;padding:7px 4px;border-radius:8px;font-size:14px}
.seg button.on{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.12);font-weight:600}
.monthnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin:0 -16px 4px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;background:var(--card);border-radius:16px;padding:6px 12px;font-size:14px}
.chip.on{background:var(--accent);color:#fff}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
.stat3 b{display:block;font-size:17px}
svg.chart{width:100%;height:auto;display:block;margin-top:8px}
.ax{fill:var(--sub);font-size:9px;text-anchor:middle}
.b0{fill:var(--accent)}.b1{fill:var(--over)}.bl{stroke:var(--warn);stroke-dasharray:4 3;stroke-width:1}
.donutwrap{display:flex;justify-content:center;margin:6px 0}
.donut{width:180px;height:180px}
.donut .track{stroke:var(--fill)}
.dt1{font-size:3px;fill:var(--sub);text-anchor:middle}.dt2{font-size:4.4px;fill:var(--text);font-weight:700;text-anchor:middle}
.catrow{display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;align-items:center;padding:8px 0}
.catrow .bar{grid-column:2/-1;margin:0}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px}
.heat div{aspect-ratio:1;border-radius:8px;font-size:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--fill);line-height:1.1}
.heat div small{font-size:8px;opacity:.85}
.heat .hd{background:none;aspect-ratio:auto;color:var(--sub)}
.heat .pad0{background:none}
.heat .today{outline:2px solid var(--accent)}
.legend{display:flex;gap:12px;font-size:12px;color:var(--sub);margin-top:8px}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;background:var(--lv);vertical-align:-1px}
.wishform{display:grid;grid-template-columns:1fr 90px auto;gap:6px;margin:10px 0}
.wish{display:flex;align-items:center;gap:6px;padding:10px 0;border-bottom:.5px solid var(--line)}
.wish:last-child{border-bottom:0}
.group{background:var(--card);border-radius:14px;padding:0 14px}
.fld{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:.5px solid var(--line);font-size:15px;min-height:46px}
.fld:last-child{border-bottom:0}
.fld>span:first-child{flex:1}
.fld input{max-width:120px;text-align:right}
.addrow{display:flex;flex-wrap:wrap;gap:6px;padding:10px 0}
.addrow input,.addrow select{flex:1 1 30%}
.rowbtn{display:block;width:100%;text-align:left;border:0;background:none;padding:13px 0;border-bottom:.5px solid var(--line);color:var(--accent);font-size:15px}
.rowbtn:last-child{border-bottom:0}
.note{font-size:13px;color:var(--sub);margin:6px 4px}
.center{text-align:center}
.switch{width:50px;height:30px;flex:none;border-radius:15px;background:var(--fill);position:relative;transition:.2s}
.switch:checked{background:var(--ok)}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:.2s}
.switch:checked::after{left:22px}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:10;display:flex;justify-content:space-around;align-items:center;background:color-mix(in srgb,var(--card) 82%,transparent);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-top:.5px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
nav.tabs button{flex:1;background:none;border:0;color:var(--sub);font-size:10px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0}
nav.tabs button.on{color:var(--accent)}
nav.tabs svg{width:24px;height:24px}
nav.tabs .add{flex:none;width:54px;height:54px;border-radius:50%;background:var(--accent);color:#fff;margin:-22px 8px 0;box-shadow:0 4px 14px color-mix(in srgb,var(--accent) 45%,transparent);justify-content:center}
nav.tabs .add svg{width:28px;height:28px}
.mask{position:fixed;inset:0;background:rgba(0,0,0,.38);opacity:0;pointer-events:none;transition:opacity .25s;z-index:20}
.mask.on{opacity:1;pointer-events:auto}
/* 弹层顶部必须避开状态栏/灵动岛：iOS 会吞掉状态栏区域的点击（用来"回到顶部"） */
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;max-height:90vh;max-height:calc(100dvh - env(safe-area-inset-top) - 12px);overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;background:var(--bg);border-radius:20px 20px 0 0;transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.8,.2,1);z-index:21;padding:0 16px calc(14px + env(safe-area-inset-bottom))}
.sheet.on{transform:none}
.sheet-top{position:sticky;top:0;z-index:2;background:var(--bg);margin:0 -16px 4px;padding:6px 16px 2px;touch-action:none}
.grab{width:38px;height:5px;border-radius:3px;background:var(--line);margin:2px auto 4px}
.sheet-h{display:flex;justify-content:space-between;align-items:center;min-height:44px}
.sheet-h .link{padding:10px 6px;font-size:16px}
html.lock,html.lock body{overflow:hidden}
.quick{display:flex;gap:6px;overflow-x:auto;margin:0 -16px 10px;padding:0 16px;scrollbar-width:none}
.quick::-webkit-scrollbar{display:none}
.setup{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:10px}
.amt{text-align:right;padding:6px 4px 10px}
.amt .expr{display:block;color:var(--sub);font-size:14px;min-height:20px}
.amt .amtv{font-size:40px;font-weight:700;font-variant-numeric:tabular-nums}
.cats{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.catb{border:1.5px solid transparent;background:var(--card);border-radius:12px;padding:6px 2px;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:1px}
.catb span{font-size:22px}
.catb.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--card))}
.fields{display:grid;grid-template-columns:1fr 140px;gap:8px;margin-top:10px}
.fields input{background:var(--card)}
.sheet .seg{margin:10px 0 0}
.pad{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.pad button{height:50px;border:0;border-radius:12px;background:var(--card);font-size:22px}
.pad button:active{opacity:.6}
.pad .ok{grid-row:span 2;height:auto;background:var(--accent);color:#fff;font-size:18px;font-weight:600}
.dialog{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.4);padding:24px}
.dialog.on{display:flex}
.dlg{background:var(--card);border-radius:18px;padding:20px 18px 12px;max-width:340px;width:100%}
.dlg h3{margin:0 0 6px;font-size:18px}
.dlg p{color:var(--sub);font-size:15px}
.dbtns{display:flex;flex-direction:column;gap:6px;margin-top:14px}
.dbtns button{border:0;border-radius:12px;padding:12px;background:var(--fill);font-size:16px}
.dbtns .primary{background:var(--accent);color:#fff;font-weight:600}
.dbtns .danger{background:var(--over);color:#fff}
.toast{position:fixed;left:50%;top:calc(10px + env(safe-area-inset-top));transform:translate(-50%,-150%);z-index:50;background:var(--card);color:var(--text);padding:10px 16px;border-radius:14px;box-shadow:0 6px 24px rgba(0,0,0,.18);font-size:15px;max-width:92vw;transition:transform .3s;border-left:4px solid var(--lv)}
.toast.on{transform:translate(-50%,0)}
</style>
</head>
<body>
<main>
  <section class="page" id="home"></section>
  <section class="page" id="list">
    <header class="top"><h1>明细</h1></header>
    <div class="monthnav">
      <button class="icon" data-act="listNav" data-v="-1" aria-label="上个月">‹</button>
      <b id="listMonth"></b>
      <button class="icon" id="listNext" data-act="listNav" data-v="1" aria-label="下个月">›</button>
    </div>
    <input id="q" type="search" placeholder="搜索备注、分类、金额">
    <div class="chips" id="listChips"></div>
    <div id="listBody"></div>
  </section>
  <section class="page" id="stats"></section>
  <section class="page" id="restraint"></section>
</main>

<nav class="tabs">
  <button data-act="go" data-v="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>首页</button>
  <button data-act="go" data-v="list"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6h12M9 12h12M9 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>明细</button>
  <button class="add" data-act="add" aria-label="记一笔"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
  <button data-act="go" data-v="stats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 21h18M6 17v-5M11 17V6M16 17v-8M21 17v-3"/></svg>统计</button>
  <button data-act="go" data-v="restraint"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/></svg>克制</button>
</nav>

<div class="mask" id="mask" data-act="close"></div>
<div class="sheet" id="addSheet"></div>
<div class="sheet" id="setSheet"></div>
<div class="dialog" id="dialog"></div>
<div class="toast" id="toast"></div>
<input type="file" id="fileIn" accept="application/json,.json" hidden>

<script>
'use strict';
const KEY = 'selfrestraint.v1';
const APP_VERSION = 'v1.1';
const DEFAULT_CATS = [
  {id:'food',   name:'餐饮',   emoji:'🍜', color:'#ff9f0a'},
  {id:'snack',  name:'零食饮料', emoji:'🧋', color:'#ff6482'},
  {id:'traffic',name:'交通',   emoji:'🚇', color:'#0a84ff'},
  {id:'shop',   name:'购物',   emoji:'🛍️', color:'#bf5af2'},
  {id:'fun',    name:'娱乐',   emoji:'🎮', color:'#5e5ce6'},
  {id:'sub',    name:'充值订阅', emoji:'💳', color:'#ac8e68'},
  {id:'daily',  name:'日用',   emoji:'🧴', color:'#64d2ff'},
  {id:'study',  name:'学习',   emoji:'📚', color:'#30d158'},
  {id:'phone',  name:'话费网络', emoji:'📱', color:'#5ac8fa'},
  {id:'social', name:'人情社交', emoji:'🎁', color:'#ff453a'},
  {id:'dress',  name:'服饰美妆', emoji:'👕', color:'#ffd60a'},
  {id:'health', name:'医疗',   emoji:'💊', color:'#66d4cf'},
  {id:'other',  name:'其他',   emoji:'📦', color:'#8e8e93'},
];
const PALETTE = ['#ff9f0a','#ff6482','#0a84ff','#bf5af2','#30d158','#ffd60a','#64d2ff','#ff453a','#5e5ce6','#ac8e68'];
const DAY_NAMES = ['日','一','二','三','四','五','六'];

/* ---------- 数据 ---------- */
function fresh(){
  return {v:1, records:[], cats:DEFAULT_CATS.map(c=>({...c})), recurring:[], wishes:[], lastCat:'food',
    settings:{daily:0, weekly:0, monthly:0, big:20000, cooldown:72, catBudgets:{}, badge:false, lastOpen:'', lastBackup:0}};
}
function merge(s){ const f = fresh(); return Object.assign(f, s, {settings:Object.assign(f.settings, s.settings)}); }
function load(){
  try { const raw = localStorage.getItem(KEY); if (raw) return merge(JSON.parse(raw)); } catch (e) {}
  return fresh();
}
function save(){
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { toast('保存失败：手机存储空间可能不足', 'over'); }
}
let S = load();

/* ---------- 工具 ---------- */
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (d, n) => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate()+n); return x; };
const startOfWeek = d => addDays(d, -((d.getDay()+6) % 7));
const daysIn = d => new Date(d.getFullYear(), d.getMonth()+1, 0).getDate();
const dayDiff = (a, b) => Math.round((parse(b) - parse(a)) / 864e5);
const monthKey = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}`;
const nextMonthKey = k => { const [y,m] = k.split('-').map(Number); return monthKey(new Date(y, m, 1)); };
const md = d => `${d.getMonth()+1}/${d.getDate()}`;
const hm = d => `${pad(d.getHours())}:${pad(d.getMinutes())}`;
const today = () => ymd(new Date());
// 金额一律用「分」存整数，避免 0.1+0.2 这类浮点误差
const yuan = c => (c/100).toLocaleString('zh-CN', {minimumFractionDigits: c%100 ? 2 : 0, maximumFractionDigits: 2});
const fmt = c => '¥' + yuan(c);
const toCents = v => Math.round(parseFloat(v || 0) * 100) || 0;
const pct = (a, b) => b ? Math.min(100, Math.round(a / b * 100)) : 0;
const sum = rs => rs.reduce((a, r) => a + r.amt, 0);
const inRange = (from, to) => S.records.filter(r => r.d >= from && r.d <= to);
const dayMap = rs => rs.reduce((m, r) => (m[r.d] = (m[r.d] || 0) + r.amt, m), {});
const sorted = rs => [...rs].sort((a, b) => b.d.localeCompare(a.d) || (b.tm||'').localeCompare(a.tm||'') || b.ts - a.ts);
const catOf = id => S.cats.find(c => c.id === id) || S.cats.find(c => c.id === 'other') || DEFAULT_CATS[DEFAULT_CATS.length-1];
const groupCat = rs => {
  const m = {}; rs.forEach(r => { (m[r.cat] ||= {v:0, n:0}); m[r.cat].v += r.amt; m[r.cat].n++; });
  return Object.entries(m).map(([id, x]) => ({c:catOf(id), id, ...x})).sort((a, b) => b.v - a.v);
};

function dayProgress(){ const n = new Date(); return (n.getHours()*60 + n.getMinutes()) / 1440; }
function weekProgress(){ const n = new Date(); return (((n.getDay()+6) % 7) + dayProgress()) / 7; }
function monthProgress(){ const n = new Date(); return (n.getDate() - 1 + dayProgress()) / daysIn(n); }

function budgets(){
  const st = S.settings, dim = daysIn(new Date());
  const daily = st.daily || (st.monthly ? Math.floor(st.monthly / dim) : 0);
  const weekly = st.weekly || daily * 7;
  return {daily, weekly, monthly: st.monthly, dailyDerived: !st.daily && !!daily};
}

// 根据「已花 / 预算」以及「这个周期已经过去了多少」判断状态，返回 'none' | 'ok' | 'warn' | 'over'
// spent、budget 单位是分；progress 是 0~1：今天已过去的比例（晚上 18 点≈0.75）、本周/本月已过去的比例，过去的日子传 1
function budgetLevel(spent, budget, progress = 1) {
  if (!budget) return 'none';
  const used = spent / budget;
  if (used > 1) return 'over';
  if (used >= 0.8) return 'warn';
  // 花钱速度比时间进度快 25 个百分点以上（且已用掉三成），也提前提醒；早上买个早餐不会触发
  if (used >= 0.3 && used - progress > 0.25) return 'warn';
  return 'ok';
}

function streaks(){

/* ---------- 统计 ---------- */
let statKind = 'month', statOff = 0;
function period(kind, off){
  const n = new Date(); let s, e, label;
  if (kind === 'week') { s = addDays(startOfWeek(n), off*7); e = addDays(s, 6); label = off === 0 ? '本周' : off === -1 ? '上周' : `${md(s)} – ${md(e)}`; }
  else if (kind === 'month') { s = new Date(n.getFullYear(), n.getMonth()+off, 1); e = new Date(s.getFullYear(), s.getMonth()+1, 0); label = off === 0 ? '本月' : `${s.getFullYear()}年${s.getMonth()+1}月`; }
  else if (kind === 'year') { s = new Date(n.getFullYear()+off, 0, 1); e = new Date(n.getFullYear()+off, 11, 31); label = `${s.getFullYear()}年`; }
  else { e = addDays(n, off*30); s = addDays(e, -29); label = off === 0 ? '近30天' : `${md(s)} – ${md(e)}`; }
  return {s, e, from: ymd(s), to: ymd(e), label};
}
function barChart(vals, labels, line){
  const W = 340, H = 150, top = 14, bot = 18, n = vals.length, max = Math.max(line || 0, ...vals, 1), bw = W / n, every = Math.ceil(n / 8);
  const y = v => H - bot - v / max * (H - top - bot);
  let g = '';
  vals.forEach((v, i) => {
    const x = i * bw, h = H - bot - y(v);
    if (v) g += `<rect x="${x + bw*.18}" y="${y(v)}" width="${bw*.64}" height="${Math.max(h, 1)}" rx="${Math.min(3, bw*.2)}" class="${line && v > line ? 'b1' : 'b0'}"/>`;
    g += `<rect x="${x}" y="0" width="${bw}" height="${H}" fill="transparent" data-act="tip" data-v="${labels[i]}：${fmt(v)}"/>`;
    if (i % every === 0) g += `<text x="${i ? x + bw/2 : 1}" y="${H - 4}" class="ax"${i ? '' : ' style="text-anchor:start"'}>${labels[i]}</text>`;
  });
  if (line) g += `<line x1="0" x2="${W}" y1="${y(line)}" y2="${y(line)}" class="bl"/><text x="${W - 2}" y="${y(line) - 3}" class="ax" style="text-anchor:end">预算 ${fmt(line)}</text>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}">${g}</svg>`;
}
function donut(items, total){
  let acc = 0;
  const segs = items.map(it => { const p = it.v / total * 100;
    const s = `<circle r="15.9155" cx="21" cy="21" fill="none" stroke="${it.c.color}" stroke-width="6" stroke-dasharray="${p} ${100 - p}" stroke-dashoffset="${25 - acc}"/>`;
    acc += p; return s; }).join('');
  return `<div class="donutwrap"><svg viewBox="0 0 42 42" class="donut"><circle r="15.9155" cx="21" cy="21" fill="none" class="track" stroke-width="6"/>${segs}
    <text x="21" y="19.5" class="dt1">总支出</text><text x="21" y="25" class="dt2">${fmt(total)}</text></svg></div>`;
}
function heatmap(p, map, daily){
  const t = today(), lead = (p.s.getDay() + 6) % 7, vals = Object.values(map), max = Math.max(1, ...vals);
  let h = ['一','二','三','四','五','六','日'].map(d => `<div class="hd">${d}</div>`).join('') + '<div class="pad0"></div>'.repeat(lead);
  for (let i = 1; i <= daysIn(p.s); i++) {
    const d = ymd(new Date(p.s.getFullYear(), p.s.getMonth(), i)), v = map[d] || 0;
    let style = '', cls = d === t ? 'today' : '';
    if (d <= t && v) {
      if (daily) { cls += ' lv-' + budgetLevel(v, daily, 1); style = 'background:color-mix(in srgb,var(--lv) 38%,var(--card))'; }
      else style = `background:color-mix(in srgb,var(--accent) ${Math.round(15 + 70 * v / max)}%,var(--card))`;
    }
    h += `<div class="${cls}" style="${style}" data-act="tip" data-v="${i}日：${fmt(v)}">${i}${v ? `<small>${v >= 100000 ? Math.round(v/100000) + 'k' : Math.round(v/100)}</small>` : ''}</div>`;
  }
  return `<div class="heat">${h}</div>` + (daily ? `<div class="legend"><span class="lv-ok">预算内</span><span class="lv-warn">接近</span><span class="lv-over">超预算</span></div>` : '');
}
function renderStats(){
  const p = period(statKind, statOff), pp = period(statKind, statOff - 1), t = today(), b = budgets();
  const end = p.to < t ? p.to : t;
  const rs = p.from > t ? [] : inRange(p.from, end), total = sum(rs);
  const elapsed = p.from > t ? 0 : dayDiff(p.from, end) + 1;
  let cmpTo = statOff === 0 ? ymd(addDays(pp.s, elapsed - 1)) : pp.to; if (cmpTo > pp.to) cmpTo = pp.to;
  const prev = sum(inRange(pp.from, cmpTo)), chg = prev ? Math.round((total - prev) / prev * 100) : null;
  const map = dayMap(rs), cats = groupCat(rs), want = sum(rs.filter(r => r.need === 'want'));
  let h = `<header class="top"><h1>统计</h1></header>
    <div class="seg">${[['week','周'],['month','月'],['year','年'],['30d','近30天']].map(([k, l]) => `<button data-act="stat" data-v="${k}" class="${statKind === k ? 'on' : ''}">${l}</button>`).join('')}</div>
    <div class="monthnav"><button class="icon" data-act="statNav" data-v="-1">‹</button><b>${p.label}</b><button class="icon" data-act="statNav" data-v="1" ${statOff >= 0 ? 'disabled' : ''}>›</button></div>
    <div class="card"><div class="muted">总支出</div><div class="big" style="margin-bottom:4px">${fmt(total)}</div>
    <div class="stat3"><div><span class="muted">日均</span><b>${fmt(elapsed ? Math.round(total / elapsed) : 0)}</b></div><div><span class="muted">笔数</span><b>${rs.length}</b></div>
    <div><span class="muted">${statOff === 0 ? '比上期同期' : '比上一期'}</span><b class="${chg > 0 ? 'red' : 'green'}">${chg === null ? '—' : (chg > 0 ? '↑' : '↓') + Math.abs(chg) + '%'}</b></div></div></div>`;
  if (!rs.length) { $('#stats').innerHTML = h + '<div class="empty">这段时间没有支出记录</div>'; return; }
  let vals = [], labels = [], line;
  if (statKind === 'year') {
    for (let m = 0; m < 12; m++) { const k = `${p.s.getFullYear()}-${pad(m+1)}`; vals.push(sum(rs.filter(r => r.d.startsWith(k)))); labels.push(m + 1 + '月'); }
    line = b.monthly;
  } else {
    for (let d = p.s; ymd(d) <= p.to; d = addDays(d, 1)) { vals.push(map[ymd(d)] || 0); labels.push(statKind === 'week' ? '周' + DAY_NAMES[d.getDay()] : (statKind === '30d' && (d === p.s || d.getDate() === 1) ? md(d) : String(d.getDate()))); }
    line = b.daily;
  }
  h += `<div class="card"><b>支出趋势</b><span class="muted"> · 点柱子看金额</span>${barChart(vals, labels, line)}</div>`;
  h += `<div class="card"><b>钱都花在哪了</b>${donut(cats, total)}${cats.map(x => `<div class="catrow" ${statKind === 'month' ? `data-act="catJump" data-v="${x.id}"` : ''}>
    <span>${x.c.emoji}</span><span>${esc(x.c.name)} <span class="muted">${x.n}笔</span></span><span><b>${fmt(x.v)}</b> <span class="muted">${Math.round(x.v / total * 100)}%</span></span>
    <div class="bar sm"><i style="width:${x.v / cats[0].v * 100}%;background:${x.c.color}"></i></div></div>`).join('')}</div>`;
  h += `<div class="card"><div class="split"><b>必要 vs 想要</b><span class="muted">想要占 ${pct(want, total)}%</span></div>
    <div class="bar" style="height:14px;display:flex"><i style="width:${100 - pct(want, total)}%;background:var(--accent);border-radius:0"></i><i style="width:${pct(want, total)}%;background:var(--warn);border-radius:0"></i></div>
    <div class="split muted"><span>必要 ${fmt(total - want)}</span><span>想要 ${fmt(want)}</span></div></div>`;
  if (statKind === 'month') h += `<div class="card"><b>消费日历</b>${heatmap(p, map, b.daily)}</div>`;
  if (statKind !== 'week') {
    const wd = [0,0,0,0,0,0,0]; rs.forEach(r => wd[(parse(r.d).getDay() + 6) % 7] += r.amt);
    const top = wd.indexOf(Math.max(...wd));
    h += `<div class="card"><b>星期几最能花</b><span class="muted"> · 周${['一','二','三','四','五','六','日'][top]}花得最多</span>${barChart(wd, ['周一','周二','周三','周四','周五','周六','周日'])}</div>`;
  }
  h += `<div class="card"><b>最大的 5 笔</b>${[...rs].sort((a, b) => b.amt - a.amt).slice(0, 5).map(rowHTML).join('')}</div>`;
  $('#stats').innerHTML = h;
}

      return `<div class="wish"><div class="mid"><div>${esc(w.name)} · <b>${fmt(w.price)}</b></div><div class="muted">${left > 0 ? `还需冷静 ${fmtLeft(left)}` : '冷静期结束了：现在还想要吗？'}</div></div>
      ${left > 0 ? '' : `<button class="link" data-act="wishBuy" data-v="${w.id}">买了</button>`}<button class="link green" data-act="wishSkip" data-v="${w.id}">不要了</button></div>`; }).join('') || '<div class="empty">清单是空的</div>'}
    ${done.length ? `<p class="muted" style="margin-top:14px">最近的决定</p>${done.map(w => `<div class="wish"><div class="mid"><div>${esc(w.name)}</div></div><span class="${w.status === 'skip' ? 'green' : 'muted'}">${w.status === 'skip' ? '忍住了 +' : '买了 '}${fmt(w.price)}</span><button class="link danger" data-act="wishDel" data-v="${w.id}">×</button></div>`).join('')}` : ''}</div>`;
  h += `<div class="card"><b>本月「想要」类消费</b><div class="big2">${fmt(want)} <span class="muted">占本月 ${pct(want, mSum)}%</span></div>
    <div class="bar"><i style="width:${pct(want, mSum)}%;background:var(--warn)"></i></div>
    <p class="muted">记账时标成「想要」的钱，不花也不影响生活。这个比例越低，说明自控越好。</p></div>`;
  if (b.daily) {
    const map = dayMap(mRs), passed = now.getDate() - 1; let okDays = 0;
    for (let i = 1; i <= passed; i++) if ((map[ymd(new Date(now.getFullYear(), now.getMonth(), i))] || 0) <= b.daily) okDays++;
    h += `<div class="card"><b>本月守住日预算的天数</b>${passed ? `<div class="big2">${okDays} / ${passed} 天</div><div class="bar lv-${okDays === passed ? 'ok' : okDays / passed >= .7 ? 'warn' : 'over'}"><i style="width:${pct(okDays, passed)}%"></i></div>` : '<p class="muted">今天是本月第一天，从今天开始加油</p>'}</div>`;
  }
  const cats = groupCat(mRs);
  if (cats.length) {
    const top = cats[0], perDay = Math.round(top.v / now.getDate());
    h += `<div class="card"><b>花钱最多的地方</b><p>本月在「${top.c.emoji} ${esc(top.c.name)}」上花了 <b>${fmt(top.v)}</b>，占 ${pct(top.v, mSum)}%，平均每天 ${fmt(perDay)}。</p>
      <p class="muted">如果这一项每天少花 ¥10，一年就能多存 ¥3,650。</p></div>`;
  }
  $('#restraint').innerHTML = h;
}

/* ---------- 记一笔 ---------- */
let draft = null;
function openAdd(r, preset){
  draft = r ? {id:r.id, amt:String(r.amt / 100), cat:r.cat, need:r.need || 'need', note:r.note || '', d:r.d, tm:r.tm, ts:r.ts}
            : {id:null, amt:'', cat:S.lastCat || 'food', need:'need', note:'', d:today(), ...preset};
  if (!S.cats.some(c => c.id === draft.cat)) draft.cat = S.cats[0].id;
  const keys = ['1','2','3','del','4','5','6','+','7','8','9','ok','.','0','C'];
  const quick = r || preset ? [] : frequent();
  $('#addSheet').innerHTML = `<div class="sheet-top"><div class="grab"></div>
    <div class="sheet-h"><button class="link" data-act="close" data-v="addSheet">取消</button><b>${draft.id ? '编辑支出' : '记一笔'}</b>${draft.id ? '<button class="link danger" data-act="delRec">删除</button>' : '<span style="width:40px"></span>'}</div></div>
    <div class="amt"><span class="expr" id="expr"></span><span class="amtv" id="amtv"></span></div>
    ${quick.length ? `<div class="quick">${quick.map(q => `<button class="chip" data-act="quick" data-v="${q.id}">${catOf(q.cat).emoji} ${esc(q.note)} ${yuan(q.amt)}</button>`).join('')}</div>` : ''}
    <div class="cats">${S.cats.map(c => `<button class="catb ${c.id === draft.cat ? 'on' : ''}" data-act="cat" data-v="${c.id}"><span>${c.emoji}</span>${esc(c.name)}</button>`).join('')}</div>
    <div class="seg"><button data-act="need" data-v="need" class="${draft.need === 'need' ? 'on' : ''}">必要（不花不行）</button><button data-act="need" data-v="want" class="${draft.need === 'want' ? 'on' : ''}">想要（可以不花）</button></div>
    <div class="fields"><input data-f="note" placeholder="备注：买了什么" maxlength="40" enterkeyhint="done" value="${esc(draft.note)}"><input type="date" data-f="d" value="${draft.d}" max="${today()}"></div>
    <div class="pad">${keys.map(k => k === 'ok' ? '<button class="ok" data-act="save">完成</button>'
      : `<button data-act="key" data-v="${k}">${k === 'del' ? '⌫' : k}</button>`).join('')}</div>`;
  updateAmt(); openSheet('addSheet');
}
// 常记的（同分类+同备注+同金额出现 2 次以上），按次数排序，点一下就填好
function frequent(){
  const m = {};
  for (const r of S.records) {
    if (!r.note || r.note.endsWith('（固定）')) continue;
    const x = m[r.cat + '|' + r.note + '|' + r.amt] ||= {r, n:0};
    x.n++; if (r.d >= x.r.d) x.r = r;
  }
  return Object.values(m).filter(x => x.n >= 2).sort((a, b) => b.n - a.n || b.r.d.localeCompare(a.r.d)).slice(0, 8).map(x => x.r);
}
const evalAmt = s => s.split('+').reduce((a, x) => a + toCents(x), 0);
function updateAmt(){
  $('#amtv').textContent = fmt(evalAmt(draft.amt));
  $('#amtv').style.opacity = draft.amt ? 1 : .35;
  $('#expr').textContent = draft.amt.includes('+') ? draft.amt.replace(/\+/g, ' + ') : '';
}
function pressKey(k){
  let s = draft.amt; const last = s.split('+').pop();
  if (k === 'del') s = s.slice(0, -1);
  else if (k === 'C') s = '';
  else if (k === '+') { if (last && !last.endsWith('.')) s += '+'; }
  else if (k === '.') { if (!last.includes('.')) s += last ? '.' : '0.'; }
  else {
    if (/\.\d{2}$/.test(last) || (!last.includes('.') && last.length >= 6)) return;
    if (last === '0') s = s.slice(0, -1);
    s += k;
  }
  draft.amt = s; updateAmt();
}
async function saveDraft(){
  const amt = evalAmt(draft.amt);
  if (amt <= 0) return toast('先输入金额', 'warn');
  const isNew = !draft.id, st = S.settings;
  if (isNew && !draft.wishId && st.big > 0 && amt >= st.big) {
    const a = await ask('这是一笔大额支出', `${fmt(amt)} 超过了你设的大额提醒线 ${fmt(st.big)}。\n如果还没付钱，先放进冷静清单，${st.cooldown} 小时后还想要再买。`,
      [{t:'还没付，先冷静一下', v:'wish', primary:true}, {t:'已经付了，记账', v:'ok'}, {t:'取消', v:null}]);
    if (!a) return;
    if (a === 'wish') {
      S.wishes.push({id:uid(), name:draft.note.trim() || catOf(draft.cat).name, price:amt, created:Date.now(), status:'wait'});
      save(); closeSheet('addSheet'); go('restraint'); return toast('已放进冷静清单 🧊');
    }
  }
  const rec = {id:draft.id || uid(), amt, cat:draft.cat, need:draft.need, note:draft.note.trim(), d:draft.d || today(), tm:draft.tm || hm(new Date()), ts:draft.ts || Date.now()};
  if (isNew) S.records.push(rec); else S.records[S.records.findIndex(x => x.id === rec.id)] = rec;
  if (draft.wishId) { const w = S.wishes.find(x => x.id === draft.wishId); if (w) Object.assign(w, {status:'bought', decided:Date.now(), price:amt}); }
  S.lastCat = rec.cat; save(); closeSheet('addSheet'); render();
  feedback(rec, isNew);
}
function feedback(rec, isNew){
  if (!isNew) return toast('已修改');
  const b = budgets(), t = today();
  const cb = S.settings.catBudgets[rec.cat];
  let catMsg = '';
  if (cb) {
    const now = new Date(), cs = sum(inRange(ymd(new Date(now.getFullYear(), now.getMonth(), 1)), t).filter(r => r.cat === rec.cat));
    if (cs > cb) catMsg = `；${catOf(rec.cat).name}本月已超 ${fmt(cs - cb)}`;
  }
  if (rec.d !== t) return toast('已记下' + catMsg, catMsg ? 'over' : 'none');
  const tSum = sum(S.records.filter(r => r.d === t)), lv = budgetLevel(tSum, b.daily, dayProgress());
  const msg = lv === 'over' ? `⚠️ 今天已花 ${fmt(tSum)}，超预算 ${fmt(tSum - b.daily)}`
    : lv === 'warn' ? `今天已花 ${fmt(tSum)}，只剩 ${fmt(Math.max(0, b.daily - tSum))} 了，悠着点`
    : `已记下，今天共花 ${fmt(tSum)}`;
  toast(msg + catMsg, catMsg && lv !== 'over' ? 'over' : lv);
}

async function shareFile(name, text, type){
  const file = new File([text], name, {type});
  if (navigator.canShare && navigator.canShare({files:[file]})) {
    try { await navigator.share({files:[file]}); return true; } catch (e) { if (e.name === 'AbortError') return false; }
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  return true;
}
async function importFile(file){
  let data; try { data = JSON.parse(await file.text()); } catch (e) { data = null; }
  if (!data || !Array.isArray(data.records)) return toast('这不是 Self restraint 的备份文件', 'over');
  const ok = await ask('从备份恢复', `备份里有 ${data.records.length} 笔记录。恢复会覆盖现在的全部数据，确定吗？`, [{t:'覆盖恢复', v:1, danger:true}, {t:'取消', v:0}]);
  if (!ok) return;
  S = merge(data); S.settings.lastOpen = today(); save(); renderSettings(); render(); toast('已恢复 ✅', 'ok');
}
async function toggleBadge(on){
  if (on) {
    const fail = m => { toast(m, 'warn'); $('#badgeT').checked = false; };
    if (navigator.standalone === false) return fail('你现在是在 Safari 里打开的，请回到桌面，点 Self restraint 图标打开后再开启');
    if (!('setAppBadge' in navigator) || !('Notification' in window)) return fail('这台设备不支持图标角标（需要 iOS 16.4 以上）');
    if (await Notification.requestPermission() !== 'granted') return fail('需要允许通知，角标才能显示');
  } else if (navigator.clearAppBadge) navigator.clearAppBadge().catch(() => {});
  S.settings.badge = on; save(); updateBadge();
}
function updateBadge(){
  if (!S.settings.badge || !navigator.setAppBadge) return;
  const v = Math.round(sum(S.records.filter(r => r.d === today())) / 100);
  (v ? navigator.setAppBadge(v) : navigator.clearAppBadge()).catch(() => {});
}

/* ---------- 固定支出 & 每日回顾 ---------- */
function runRecurring(){
  const t = today(), cur = monthKey(new Date()); let changed = false;
  for (const r of S.recurring) {
    for (let k = nextMonthKey(r.last); k <= cur; k = nextMonthKey(k)) {
      const [y, m] = k.split('-').map(Number), d = `${k}-${pad(Math.min(r.day, new Date(y, m, 0).getDate()))}`;
      if (d > t) break;
      S.records.push({id:uid(), amt:r.amt, cat:r.cat, need:'need', note:r.name + '（固定）', d, tm:'00:00', ts:Date.now()});
      r.last = k; changed = true;
    }
  }
  if (changed) save();
}
function dailyReview(){
  const t = today(), st = S.settings;
  if (st.lastOpen === t) return;
  const first = !st.lastOpen; st.lastOpen = t; save();
  if (first || !S.records.length) return;
  const y = ymd(addDays(new Date(), -1)), ys = sum(S.records.filter(r => r.d === y)), b = budgets();
  let msg = ys ? `昨天一共花了 ${fmt(ys)}` : '昨天一分钱没花（还是忘了记账？）';
  if (b.daily && ys) msg += ys > b.daily ? `，超出日预算 ${fmt(ys - b.daily)}。今天收着点 💪` : '，守住了预算 👍';
  const now = new Date(), wSum = sum(inRange(ymd(startOfWeek(now)), y));
  if (now.getDay() !== 1) msg += `\n本周到昨天为止：${fmt(wSum)}${b.weekly ? ` / 预算 ${fmt(b.weekly)}` : ''}`;
  else {
    const ws = startOfWeek(now), lw = sum(inRange(ymd(addDays(ws, -7)), ymd(addDays(ws, -1))));
    msg += `\n上周一共花了 ${fmt(lw)}${b.weekly ? (lw > b.weekly ? `，超出周预算 ${fmt(lw - b.weekly)}` : '，守住了周预算 👍') : ''}`;
  }
  if (now.getDate() === 1) {
    const pm = new Date(now.getFullYear(), now.getMonth() - 1, 1), ls = sum(inRange(ymd(pm), y)), mb = S.settings.monthly;
    msg += `\n${pm.getMonth() + 1}月一共花了 ${fmt(ls)}${mb ? (ls > mb ? `，超出月预算 ${fmt(ls - mb)}` : '，守住了月预算 🎉') : ''}`;
  }
  ask('📒 昨日回顾', msg, [{t:'知道了', v:1, primary:true}]);
}

/* ---------- 路由与事件 ---------- */
let tab = 'home';
function go(t){
  tab = t;

  $$('nav.tabs [data-v]').forEach(b => b.classList.toggle('on', b.dataset.v === t));

const actions = {
  go, add: () => openAdd(),
  edit: id => { const r = S.records.find(x => x.id === id); if (r) openAdd(r); },
  close: id => closeSheet(id),
  key: pressKey, save: saveDraft,
  cat: v => { draft.cat = v; $$('#addSheet .catb').forEach(b => b.classList.toggle('on', b.dataset.v === v)); },
  need: v => { draft.need = v; $$('#addSheet .seg button').forEach(b => b.classList.toggle('on', b.dataset.v === v)); },
  delRec: async () => {
    if (!await ask('删除这笔记录？', '删除后不能恢复。', [{t:'删除', v:1, danger:true}, {t:'取消', v:0}])) return;
    S.records = S.records.filter(r => r.id !== draft.id); save(); closeSheet('addSheet'); render(); toast('已删除');
  },
  settings: () => { renderSettings(); openSheet('setSheet'); },
  listNav: v => { listMonth = Math.min(0, listMonth + +v); renderList(); },
  listCat: v => { listCat = v; renderList(); },
  stat: v => { statKind = v; statOff = 0; renderStats(); },
  statNav: v => { statOff = Math.min(0, statOff + +v); renderStats(); },
  catJump: v => { listCat = v; listMonth = statOff; listQ = ''; $('#q').value = ''; go('list'); },
  tip: v => toast(v),
  wishAdd: () => {
    const name = $('#wName').value.trim(), price = toCents($('#wPrice').value);
    if (!name || price <= 0) return toast('填上名称和价格', 'warn');
    S.wishes.push({id:uid(), name, price, created:Date.now(), status:'wait'}); save(); renderRestraint();
    toast(`已放进冷静清单，${S.settings.cooldown} 小时后再决定 🧊`);
  },
  wishBuy: id => { const w = S.wishes.find(x => x.id === id); openAdd(null, {amt:String(w.price / 100), note:w.name, need:'want', cat:'shop', wishId:id}); },
  wishSkip: id => { const w = S.wishes.find(x => x.id === id); Object.assign(w, {status:'skip', decided:Date.now()}); save(); render(); toast(`忍住了！又省下 ${fmt(w.price)} 🎉`, 'ok'); },
  wishDel: id => { S.wishes = S.wishes.filter(w => w.id !== id); save(); render(); },
  recAdd: () => {
    const name = $('#rName').value.trim(), amt = toCents($('#rAmt').value), day = parseInt($('#rDay').value);
    if (!name || amt <= 0 || !(day >= 1 && day <= 31)) return toast('名称、金额、日期（1-31）都要填', 'warn');
    const now = new Date();
    // 本月扣款日已过就从下个月开始，避免和你手动记过的重复
    const last = day < now.getDate() ? monthKey(now) : monthKey(new Date(now.getFullYear(), now.getMonth() - 1, 1));
    S.recurring.push({id:uid(), name, amt, day, cat:$('#rCat').value, last});
    runRecurring(); save(); renderSettings(); render(); toast('已添加固定支出');
  },
  recDel: id => { S.recurring = S.recurring.filter(r => r.id !== id); save(); renderSettings(); },
  catAdd: () => {
    const name = $('#cName').value.trim(); if (!name) return toast('填上分类名称', 'warn');
    S.cats.splice(S.cats.length - 1, 0, {id:'c' + uid(), name, emoji:$('#cEmoji').value.trim() || '🏷️', color:PALETTE[S.cats.length % PALETTE.length]});
    save(); renderSettings(); toast('已添加分类');
  },
  catDel: async id => {
    const c = catOf(id);
    if (!await ask(`删除「${c.name}」？`, '这个分类下的记录会移到「其他」。', [{t:'删除', v:1, danger:true}, {t:'取消', v:0}])) return;
    S.records.forEach(r => { if (r.cat === id) r.cat = 'other'; });
    S.recurring.forEach(r => { if (r.cat === id) r.cat = 'other'; });
    S.cats = S.cats.filter(x => x.id !== id); delete S.settings.catBudgets[id];
    save(); renderSettings(); render();
  },
  exportCsv: () => {
    const rows = [['日期','时间','分类','金额','必要/想要','备注']].concat(sorted(S.records).map(r => [r.d, r.tm || '', catOf(r.cat).name, (r.amt / 100).toFixed(2), r.need === 'want' ? '想要' : '必要', r.note || '']));
    shareFile(`SelfRestraint-${today()}.csv`, '﻿' + rows.map(r => r.map(x => `"${String(x).replace(/"/g, '""')}"`).join(',')).join('\n'), 'text/csv');
  },
  backup: async () => {
    if (!await shareFile(`SelfRestraint-backup-${today()}.json`, JSON.stringify(S), 'application/json')) return;
    S.settings.lastBackup = Date.now(); save(); render(); toast('已备份 ✅ 记得选「存储到文件」', 'ok');
  },
  quickBudget: () => {
    const v = toCents($('#quickBudget').value);
    if (v <= 0) return toast('填一个大于 0 的金额', 'warn');
    S.settings.monthly = v; save(); render();
    toast(`月预算 ${fmt(v)}，平均每天 ${fmt(budgets().daily)}`, 'ok');
  },
  quick: id => {
    const r = S.records.find(x => x.id === id); if (!r) return;
    Object.assign(draft, {amt:String(r.amt / 100), cat:r.cat, need:r.need || 'need', note:r.note});
    $$('#addSheet .catb').forEach(b => b.classList.toggle('on', b.dataset.v === r.cat));
    $$('#addSheet .seg button').forEach(b => b.classList.toggle('on', b.dataset.v === draft.need));
    $('#addSheet [data-f=note]').value = r.note; updateAmt();
  },
  restore: () => $('#fileIn').click(),
  reset: async () => {
    if (!await ask('清空所有数据？', '所有记录、预算、清单都会被删除，没有备份就找不回来。', [{t:'全部清空', v:1, danger:true}, {t:'取消', v:0}])) return;
    S = fresh(); S.settings.lastOpen = today(); save(); renderSettings(); render(); toast('已清空');
  },
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const fn = actions[el.dataset.act]; if (fn) fn(el.dataset.v);
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.f && draft) draft[el.dataset.f] = el.value;
  else if (el.id === 'q') { listQ = el.value; renderList(); }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.set) {
    const k = el.dataset.set;
    S.settings[k] = k === 'cooldown' ? Math.max(0, parseInt(el.value) || 0) : Math.max(0, toCents(el.value));
    save(); render();
  } else if (el.dataset.cb) {
    const v = toCents(el.value);
    if (v > 0) S.settings.catBudgets[el.dataset.cb] = v; else delete S.settings.catBudgets[el.dataset.cb];
    save(); render();
  } else if (el.id === 'badgeT') toggleBadge(el.checked);
  else if (el.id === 'fileIn' && el.files[0]) { importFile(el.files[0]); el.value = ''; }
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.matches('input')) e.target.blur(); });
// 按住弹层顶部往下拖可以关闭，和系统弹窗手感一致
let drag = null;
document.addEventListener('touchstart', e => {
  const top = e.target.closest('.sheet-top');
  if (top) drag = {sh: top.parentElement, y: e.touches[0].clientY, dy: 0};
}, {passive: true});
document.addEventListener('touchmove', e => {
  if (!drag) return;
  drag.dy = Math.max(0, e.touches[0].clientY - drag.y);
  if (drag.dy > 6) { drag.sh.style.transition = 'none'; drag.sh.style.transform = `translateY(${drag.dy}px)`; }
}, {passive: true});
const endDrag = () => {
  if (!drag) return;
  const {sh, dy} = drag; drag = null;
  sh.style.transition = ''; sh.style.transform = '';
  if (dy > 80) closeSheet(sh.id);
};
document.addEventListener('touchend', endDrag);
document.addEventListener('touchcancel', endDrag);
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') { runRecurring(); render(); dailyReview(); }
});

runRecurring();
go('home');
dailyReview();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('/sw.js', {scope: '/'});
// 申请"持久存储"，降低系统在空间紧张时清掉记账数据的可能
navigator.storage?.persist?.().catch(() => {});
</script>
</body>
</html>
