<!doctype html>
<html lang="zh-CN" class="f1">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="平安账本">
<meta name="theme-color" content="#f7f3ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141210" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="/mama/icon-180.png">
<link rel="manifest" href="/mama/manifest.webmanifest">
<title>平安账本</title>
<style>
:root{--bg:#f7f3ee;--card:#fff;--text:#1f1a17;--sub:#7a6f66;--line:#ebe3da;--fill:#efe8e0;--in:#1d9a52;--car:#e06a12;--home:#2f6fdb;--bad:#d93a2b;--accent:#c8501e}
@media (prefers-color-scheme: dark){:root{--bg:#141210;--card:#221f1c;--text:#f4efe9;--sub:#aaa096;--line:#36302b;--fill:#2e2a26;--in:#3ccf7a;--car:#ff9a4d;--home:#79a6ff;--bad:#ff6b5c;--accent:#ff8a50}}
/* 字号三档：所有尺寸都用 rem，切换根字号即可整体放大 */
html.f0{font-size:16px}html.f1{font-size:19px}html.f2{font-size:23px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;line-height:1.45;-webkit-text-size-adjust:100%}
body{padding-top:env(safe-area-inset-top);overscroll-behavior-y:none}
main{max-width:560px;margin:0 auto;padding:.3rem 14px calc(5.5rem + env(safe-area-inset-bottom))}
.page{display:none}.page.on{display:block}
button{font:inherit;color:inherit;cursor:pointer}
input,select{font:inherit;font-size:max(16px,1rem);color:var(--text);background:var(--fill);border:0;border-radius:.6rem;padding:.6rem .7rem;width:100%;min-width:0;outline:none;-webkit-appearance:none;appearance:none}
header.top{padding:.6rem 2px .8rem}
.date{color:var(--sub);font-size:.9rem}
h1{margin:0;font-size:1.7rem;font-weight:800}
h2{margin:0 0 .5rem;font-size:1.1rem}
.card{background:var(--card);border-radius:1rem;padding:1rem;margin-bottom:.8rem}
.sub{color:var(--sub);font-size:.85rem}
.in{color:var(--in)}.car{color:var(--car)}.home{color:var(--home)}.neg,.bad{color:var(--bad)}.good{color:var(--in)}
b{font-variant-numeric:tabular-nums}
.cheer{display:flex;gap:.8rem;align-items:center;background:var(--card);border-radius:1rem;padding:1rem;margin-bottom:.8rem;border:2px solid color-mix(in srgb,var(--accent) 25%,transparent)}
.cheer .ce{font-size:2.4rem;line-height:1}
.cheer .ct{font-size:1.1rem;font-weight:700}
.cheer .cs{color:var(--sub);font-size:.95rem;margin-top:.2rem}
.trow{display:flex;justify-content:space-between;align-items:baseline;padding:.45rem 0;font-size:1.05rem;border-bottom:1px solid var(--line)}
.trow b{font-size:1.35rem}
.trow.total{border:0;padding-top:.7rem}
.trow.total span{font-weight:700}.trow.total b{font-size:1.7rem}
.bigbtns{display:grid;gap:.6rem;margin-bottom:.8rem}
.bb{display:flex;align-items:center;gap:.7rem;border:0;border-radius:1rem;padding:1rem 1.1rem;font-size:1.6rem;color:#fff;font-weight:700;min-height:4.2rem}
.bb span{font-size:1.25rem}
.bb.in{background:var(--in)}.bb.car{background:var(--car)}.bb.home{background:var(--home)}
.bb:active{transform:scale(.98);opacity:.9}
.row{display:flex;align-items:center;gap:.7rem;padding:.65rem 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.dot{width:2.3rem;height:2.3rem;border-radius:.7rem;display:grid;place-items:center;flex:none;background:var(--fill);font-size:1.15rem}
.mid{flex:1;min-width:0;font-size:1.05rem}
.mid>div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row>b{font-size:1.15rem}
.empty{color:var(--sub);text-align:center;padding:1.2rem .5rem}
.dayh{display:flex;justify-content:space-between;color:var(--sub);font-size:.9rem;margin:1rem .2rem .4rem}
.warnc{background:color-mix(in srgb,var(--bad) 12%,var(--card));font-size:1.05rem}
.notec{background:color-mix(in srgb,var(--accent) 12%,var(--card));font-size:1rem}
.seg{display:flex;background:var(--fill);border-radius:.8rem;padding:3px;gap:3px;margin-bottom:.8rem}
.seg button{flex:1;border:0;background:none;padding:.55rem .2rem;border-radius:.65rem;font-size:1rem}
.seg button.on{background:var(--card);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:.8rem;font-size:1.1rem}
.nav button{width:2.6rem;height:2.6rem;border:0;border-radius:50%;background:var(--card);font-size:1.4rem}
.nav button:disabled{opacity:.3}
.big{font-size:2.1rem;font-weight:800;margin:.2rem 0}
.crow{display:grid;grid-template-columns:auto 1fr;gap:.1rem .6rem;padding:.6rem 0;border-bottom:1px solid var(--line)}
.crow:last-child{border-bottom:0}
.crow .cl{font-size:1.05rem}.crow .cv{text-align:right;font-size:1.25rem;font-weight:700}
.crow .cd{grid-column:1/-1;text-align:right;font-size:.9rem}
.bar{height:.6rem;border-radius:.3rem;background:var(--fill);overflow:hidden;margin-top:.25rem}
.bar i{display:block;height:100%;border-radius:inherit}
.tagrow{padding:.45rem 0}
.tagrow .split{display:flex;justify-content:space-between;font-size:1rem}
svg.chart{width:100%;height:auto;display:block;margin-top:.4rem}
.ax{fill:var(--sub);font-size:10px;text-anchor:middle}
.bi{fill:var(--in)}
.btn{border:0;border-radius:.7rem;background:var(--accent);color:#fff;padding:.7rem 1rem;font-weight:700;white-space:nowrap}
.btn.wide{width:100%;padding:.9rem;font-size:1.15rem}
.btn.ghost{background:var(--fill);color:var(--text)}
.rowbtn{display:block;width:100%;text-align:left;border:0;background:none;padding:.85rem 0;border-bottom:1px solid var(--line);font-size:1.05rem;color:var(--accent)}
.rowbtn:last-child{border-bottom:0}
.form{display:grid;gap:.6rem}
.form label{display:grid;gap:.25rem;color:var(--sub);font-size:.9rem}
.chips{display:flex;flex-wrap:wrap;gap:.4rem}
.chip{border:0;background:var(--fill);border-radius:2rem;padding:.4rem .8rem;font-size:.95rem}
.rem{display:flex;align-items:center;gap:.6rem;padding:.7rem 0;border-bottom:1px solid var(--line)}
.rem:last-of-type{border-bottom:0}
.link{border:0;background:none;color:var(--accent);padding:.4rem;font-size:1rem}
.link.danger{color:var(--bad)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;background:color-mix(in srgb,var(--card) 90%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:.3rem 4px calc(.3rem + env(safe-area-inset-bottom))}
nav.tabs button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:1px;padding:.3rem 0;color:var(--sub);font-size:.85rem}
nav.tabs button span{font-size:1.45rem;line-height:1.2;filter:grayscale(1);opacity:.6}
nav.tabs button.on{color:var(--accent);font-weight:700}
nav.tabs button.on span{filter:none;opacity:1}
.mask{position:fixed;inset:0;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .25s;z-index:20}
.mask.on{opacity:1;pointer-events:auto}
/* 弹层顶部必须避开状态栏/灵动岛：那块区域的点击会被 iOS 拿去「回到顶部」 */
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;max-height:92vh;max-height:calc(100dvh - env(safe-area-inset-top) - 10px);overflow-y:auto;overscroll-behavior:contain;background:var(--bg);border-radius:1.2rem 1.2rem 0 0;transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);z-index:21;padding:0 14px calc(12px + env(safe-area-inset-bottom))}
.sheet.on{transform:none}
.sheet-top{position:sticky;top:0;z-index:2;background:var(--bg);margin:0 -14px .3rem;padding:6px 14px 2px;touch-action:none}
.grab{width:2.4rem;height:5px;border-radius:3px;background:var(--line);margin:2px auto 4px}
.sheet-h{display:flex;justify-content:space-between;align-items:center;min-height:2.6rem}
.sheet-h b{font-size:1.15rem}
html.lock,html.lock body{overflow:hidden}
.amt{text-align:right;font-size:2.6rem;font-weight:800;padding:.1rem .3rem .5rem;font-variant-numeric:tabular-nums}
.tags{display:grid;grid-template-columns:repeat(4,1fr);gap:.4rem;margin-bottom:.6rem}
.tag{border:2px solid transparent;background:var(--card);border-radius:.7rem;padding:.5rem .1rem;font-size:.95rem}
.tag.on{border-color:currentColor;font-weight:700}
.days{display:grid;grid-template-columns:1fr 1fr 1fr 1.3fr;gap:.4rem;margin-bottom:.6rem}
.days button{border:2px solid transparent;background:var(--card);border-radius:.7rem;padding:.5rem 0;font-size:1rem}
.days button.on{border-color:var(--accent);color:var(--accent);font-weight:700}
.days input{background:var(--card);padding:.5rem .3rem;font-size:max(16px,.9rem);text-align:center}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:.45rem;margin-top:.6rem}
.pad button{height:3.2rem;border:0;border-radius:.8rem;background:var(--card);font-size:1.6rem;font-weight:600}
.pad button:active{background:var(--fill)}
.savebtn{margin-top:.6rem;width:100%;border:0;border-radius:1rem;color:#fff;font-size:1.35rem;font-weight:800;padding:.9rem}
.dialog{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.45);padding:24px}
.dialog.on{display:flex}
.dlg{background:var(--card);border-radius:1.1rem;padding:1.2rem 1.1rem .9rem;max-width:360px;width:100%}
.dlg h3{margin:0 0 .4rem;font-size:1.2rem}
.dlg p{color:var(--sub);margin:0;font-size:1rem}
.dbtns{display:grid;gap:.45rem;margin-top:1rem}
.dbtns button{border:0;border-radius:.8rem;padding:.8rem;background:var(--fill);font-size:1.05rem}
.dbtns .primary{background:var(--accent);color:#fff;font-weight:700}
.dbtns .danger{background:var(--bad);color:#fff;font-weight:700}
.toast{position:fixed;left:50%;top:calc(10px + env(safe-area-inset-top));transform:translate(-50%,-160%);z-index:50;background:var(--card);padding:.75rem 1.1rem;border-radius:1rem;box-shadow:0 6px 24px rgba(0,0,0,.2);font-size:1.05rem;max-width:92vw;transition:transform .3s;border-left:5px solid var(--in)}
.toast.on{transform:translate(-50%,0)}
</style>
</head>
<body>
<main>
  <section class="page" id="today"></section>
  <section class="page" id="book"></section>
  <section class="page" id="stats"></section>
  <section class="page" id="more"></section>
</main>
<nav class="tabs">
  <button data-act="go" data-v="today"><span>🏠</span>今天</button>
  <button data-act="go" data-v="book"><span>📒</span>账本</button>
  <button data-act="go" data-v="stats"><span>📊</span>比一比</button>
  <button data-act="go" data-v="more"><span>⚙️</span>更多</button>
</nav>
<div class="mask" id="mask" data-act="close"></div>
<div class="sheet" id="entry"></div>
<div class="dialog" id="dialog"></div>
<div class="toast" id="toast"></div>
<input type="file" id="fileIn" accept="application/json,.json" hidden>

<script>
'use strict';
const KEY = 'pingan.v1';
const VERSION = 'v1.0';
// 三种账：车费收入 / 车子花钱 / 家里花钱。「其他收入」不算进车子挣的钱
const TYPES = {
  in:   {name:'车费收入', emoji:'💰', tags:['车费','包车','捎货','其他收入']},
  car:  {name:'车子花钱', emoji:'🔧', tags:['加油','维修','换配件','保养','洗车','过路费','停车费','保险','年审','罚款','其他']},
  home: {name:'家里花钱', emoji:'🏠', tags:['买菜','日用品','水电燃气','话费','孩子','看病','人情','衣服','其他']},
};
const REM_PRESETS = ['车险到期','车辆年审','营运证审验','驾驶证审验','下次保养','换机油'];
const WD = ['日','一','二','三','四','五','六'];

/* ---------- 数据 ---------- */
function fresh(){ return {v:1, recs:[], rems:[], settings:{font:1, lastBackup:0}}; }
function load(){
  let raw = null;
  try { raw = localStorage.getItem(KEY); if (raw) { const s = JSON.parse(raw), f = fresh(); return Object.assign(f, s, {settings:Object.assign(f.settings, s.settings)}); } }
  catch (e) { if (raw) try { localStorage.setItem(KEY + '.unreadable', raw); } catch (e2) {} } // 读不出来先留一份，别被新数据覆盖
  return fresh();
}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { toast('保存失败，手机空间可能不够了', 'bad'); } }
let S = load();

/* ---------- 工具 ---------- */
const $ = s => document.querySelector(s), $$ = s => document.querySelectorAll(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (d, n) => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() + n); return x; };
const startOfWeek = d => addDays(d, -((d.getDay() + 6) % 7));
const daysIn = d => new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
const dayDiff = (a, b) => Math.round((parse(b) - parse(a)) / 864e5);
const today = () => ymd(new Date());
const md = s => { const d = parse(s); return `${d.getMonth() + 1}月${d.getDate()}日`; };
// 金额按「分」存整数，避免小数误差
const yuan = c => (c / 100).toLocaleString('zh-CN', {minimumFractionDigits: c % 100 ? 2 : 0, maximumFractionDigits: 2});
const fmt = c => (c < 0 ? '-' : '') + '¥' + yuan(Math.abs(c));
const toCents = v => Math.round(parseFloat(v || 0) * 100) || 0;
const inRange = (f, t) => S.recs.filter(r => r.d >= f && r.d <= t);
const isCarIn = r => r.type === 'in' && r.tag !== '其他收入';
const sorted = rs => [...rs].sort((a, b) => b.d.localeCompare(a.d) || b.ts - a.ts);
function totals(rs){
  const t = {carIn:0, otherIn:0, car:0, home:0};
  rs.forEach(r => { if (r.type === 'in') { if (isCarIn(r)) t.carIn += r.amt; else t.otherIn += r.amt; } else t[r.type] += r.amt; });
  t.in = t.carIn + t.otherIn; t.carNet = t.carIn - t.car; t.left = t.in - t.car - t.home;
  t.work = new Set(rs.filter(isCarIn).map(r => r.d)).size;
  return t;
}
const carInOn = d => totals(S.recs.filter(r => r.d === d)).carIn;

/* ---------- 弹层 / 对话框 / 提示 ---------- */
function openSheet(){ const s = $('#entry'); s.scrollTop = 0; s.classList.add('on'); $('#mask').classList.add('on'); document.documentElement.classList.add('lock'); }
function closeSheet(){ $('#entry').classList.remove('on'); $('#mask').classList.remove('on'); document.documentElement.classList.remove('lock'); }
function ask(title, msg, btns){
  return new Promise(res => {
    const box = $('#dialog');
    box.innerHTML = `<div class="dlg"><h3>${esc(title)}</h3><p>${esc(msg).replace(/\n/g, '<br>')}</p><div class="dbtns">${
      btns.map((b, i) => `<button data-i="${i}" class="${b.primary ? 'primary' : ''}${b.danger ? ' danger' : ''}">${esc(b.t)}</button>`).join('')}</div></div>`;
    box.classList.add('on');
    box.onclick = e => { const b = e.target.closest('button[data-i]'); if (!b) return; box.classList.remove('on'); box.onclick = null; res(btns[+b.dataset.i].v); };
  });
}
let toastTimer;
function toast(msg, kind = 'in'){
  const t = $('#toast'); t.textContent = msg; t.style.borderLeftColor = `var(--${kind})`; t.classList.add('on');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('on'), 3000);
}

/* ---------- 今天 ---------- */
// 鼓励：拿今天车费和「最近 7 个出车日」的平均比；还没记车费时说说昨天
function cheer(inc){
  const now = new Date(), past = [];
  for (let i = 1; i <= 30 && past.length < 7; i++) { const v = carInOn(ymd(addDays(now, -i))); if (v) past.push(v); }
  const avg = past.length ? past.reduce((a, b) => a + b, 0) / past.length : 0;
  if (!inc) {
    const y = carInOn(ymd(addDays(now, -1)));
    if (now.getHours() < 16) return y ? {e:'☀️', t:`昨天挣了 ${fmt(y)}，辛苦了！`, s:'今天也慢慢开，平平安安最重要。'} : {e:'🚗', t:'今天出车了吗？', s:'收车后把今天的车费记上就行。开车注意安全。'};
    return {e:'🌙', t:'今天还没记车费', s:'跑了车就记一下；要是今天休息，那就好好歇着，身体最要紧。'};
  }
  const best30 = Math.max(0, ...Array.from({length:30}, (_, i) => carInOn(ymd(addDays(now, -i - 1)))));
  if (past.length >= 3 && inc > best30) return {e:'🏆', t:`今天挣了 ${fmt(inc)}，是最近一个月最多的一天！`, s:'太厉害了！也别太累着，早点休息。'};
  if (!avg) return {e:'👍', t:`今天挣了 ${fmt(inc)}，辛苦了！`, s:'多记几天，就能看出哪天跑得好了。'};
  const r = inc / avg;
  if (r >= 1.2) return {e:'🎉', t:`今天跑得真好！比平时多挣 ${fmt(Math.round(inc - avg))}`, s:'真能干！也别太累，喝口水歇一歇。'};
  if (r >= 0.9) return {e:'😊', t:`今天挣了 ${fmt(inc)}，和平时差不多，很稳！`, s:'辛苦啦，安安稳稳就是好日子。'};
  if (r >= 0.6) return {e:'🙂', t:`今天比平时少了 ${fmt(Math.round(avg - inc))}`, s:'有的日子客人就是少，不怪你。明天会好的！'};
  return {e:'🤗', t:'今天生意淡了点，没关系', s:'平平安安回家就是最好的，钱慢慢挣。'};
}
function rowHTML(r){
  return `<div class="row" data-act="edit" data-v="${r.id}"><span class="dot">${TYPES[r.type].emoji}</span>
    <div class="mid"><div>${esc(r.tag)}${r.note ? ` <span class="sub">${esc(r.note)}</span>` : ''}</div></div>
    <b class="${r.type}">${r.type === 'in' ? '+' : '-'}${yuan(r.amt)}</b></div>`;
}
function dueRems(){ return S.rems.map(r => ({...r, left: dayDiff(today(), r.date)})).filter(r => r.left <= 30).sort((a, b) => a.left - b.left); }
function renderToday(){
  const now = new Date(), t = today(), tt = totals(S.recs.filter(r => r.d === t)), c = cheer(tt.carIn);
  const m = totals(inRange(ymd(new Date(now.getFullYear(), now.getMonth(), 1)), t));
  let h = `<header class="top"><div class="date">${now.getMonth() + 1}月${now.getDate()}日 星期${WD[now.getDay()]}</div><h1>平安账本</h1></header>
    <div class="cheer"><div class="ce">${c.e}</div><div><div class="ct">${c.t}</div><div class="cs">${c.s}</div></div></div>
    <div class="card">
      <div class="trow"><span>💰 今天车费</span><b class="in">${fmt(tt.carIn)}</b></div>
      ${tt.otherIn ? `<div class="trow"><span>➕ 其他收入</span><b class="in">${fmt(tt.otherIn)}</b></div>` : ''}
      <div class="trow"><span>🔧 车子花了</span><b class="car">${fmt(tt.car)}</b></div>
      <div class="trow"><span>🏠 家里花了</span><b class="home">${fmt(tt.home)}</b></div>
      <div class="trow total"><span>今天落下</span><b class="${tt.left < 0 ? 'neg' : 'in'}">${fmt(tt.left)}</b></div></div>
    <div class="bigbtns">${Object.entries(TYPES).map(([k, T]) => `<button class="bb ${k}" data-act="add" data-v="${k}">${T.emoji}<span>记${T.name}</span></button>`).join('')}</div>`;
  h += dueRems().map(r => `<div class="card warnc" data-act="go" data-v="more">⏰ <b>${esc(r.name)}</b> ${r.left < 0 ? `已经过期 ${-r.left} 天了！` : r.left === 0 ? '就是今天！' : `还有 ${r.left} 天（${md(r.date)}）`}</div>`).join('');

/* ---------- 比一比 ---------- */
let stKind = 'week', stOff = 0;
function period(kind, off){
  const n = new Date(); let s, e, label;
  if (kind === 'week') { s = addDays(startOfWeek(n), off * 7); e = addDays(s, 6); label = off === 0 ? '这周' : off === -1 ? '上周' : `${s.getMonth() + 1}/${s.getDate()} – ${e.getMonth() + 1}/${e.getDate()}`; }
  else if (kind === 'month') { s = new Date(n.getFullYear(), n.getMonth() + off, 1); e = new Date(s.getFullYear(), s.getMonth() + 1, 0); label = off === 0 ? '这个月' : `${s.getFullYear()}年${s.getMonth() + 1}月`; }
  else { s = new Date(n.getFullYear() + off, 0, 1); e = new Date(n.getFullYear() + off, 11, 31); label = off === 0 ? '今年' : `${s.getFullYear()}年`; }
  return {s, e, from: ymd(s), to: ymd(e), label};
}
function barChart(vals, labels){
  const W = 340, H = 140, top = 12, bot = 18, n = vals.length, max = Math.max(1, ...vals), bw = W / n, every = Math.ceil(n / 8);
  let g = '';
  vals.forEach((v, i) => {
    const h = v / max * (H - top - bot), x = i * bw;
    if (v) g += `<rect x="${x + bw * .15}" y="${H - bot - h}" width="${bw * .7}" height="${Math.max(1, h)}" rx="${Math.min(4, bw * .2)}" class="bi"/>`;
    g += `<rect x="${x}" y="0" width="${bw}" height="${H}" fill="transparent" data-act="tip" data-v="${labels[i]}：车费 ${fmt(v)}"/>`;
    if (i % every === 0) g += `<text x="${i ? x + bw / 2 : 1}" y="${H - 4}" class="ax"${i ? '' : ' style="text-anchor:start"'}>${labels[i]}</text>`;
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}">${g}</svg>`;
}
function tagList(rs, type){
  const m = {}; rs.filter(r => r.type === type).forEach(r => m[r.tag] = (m[r.tag] || 0) + r.amt);
  const list = Object.entries(m).sort((a, b) => b[1] - a[1]); if (!list.length) return '<div class="sub">没有</div>';
  return list.map(([k, v]) => `<div class="tagrow"><div class="split"><span>${esc(k)}</span><b>${fmt(v)}</b></div><div class="bar"><i style="width:${v / list[0][1] * 100}%;background:var(--${type})"></i></div></div>`).join('');
}
function renderStats(){
  const p = period(stKind, stOff), pp = period(stKind, stOff - 1), t = today(), end = p.to < t ? p.to : t;
  const rs = p.from > t ? [] : inRange(p.from, end), cur = totals(rs);
  const elapsed = p.from > t ? 0 : dayDiff(p.from, end) + 1;
  // 这周/这个月还没过完，就跟上一期「同样天数」比，才公平
  let cmpTo = stOff === 0 ? ymd(addDays(pp.s, elapsed - 1)) : pp.to; if (cmpTo > pp.to) cmpTo = pp.to;
  const prev = totals(inRange(pp.from, cmpTo));
  const pn = {week:'上周', month:'上个月', year:'去年'}[stKind] + (stOff === 0 ? '同期' : '');
  const cmp = (label, a, b, upGood, cls) => {
    const d = a - b, txt = !a && !b ? '' : d === 0 ? `和${pn}一样` : `比${pn}${d > 0 ? '多' : '少'} ${fmt(Math.abs(d))}${b > 0 ? `（${Math.round(Math.abs(d) / b * 100)}%）` : ''}`;
    return `<div class="crow"><div class="cl">${label}</div><div class="cv ${cls}">${fmt(a)}</div>${txt ? `<div class="cd ${d === 0 ? '' : (d > 0) === upGood ? 'good' : 'bad'}">${d > 0 ? '↑ ' : d < 0 ? '↓ ' : ''}${txt}</div>` : ''}</div>`;
  };
  const diff = cur.carNet - prev.carNet;
  const sum = !rs.length ? '还没有记账' : !prev.carIn && !prev.car ? `📒 ${pn}没有记录，以后就能比了`
    : diff > 0 ? `🎉 车子比${pn}多挣了 ${fmt(diff)}` : diff < 0 ? `💪 比${pn}少挣 ${fmt(-diff)}，慢慢来` : `👍 和${pn}一样`;
  let h = `<header class="top"><h1>比一比</h1></header>
    <div class="seg">${[['week', '周'], ['month', '月'], ['year', '年']].map(([k, l]) => `<button data-act="stKind" data-v="${k}" class="${stKind === k ? 'on' : ''}">${l}</button>`).join('')}</div>
    <div class="nav"><button data-act="stNav" data-v="-1">‹</button><b>${p.label}</b><button data-act="stNav" data-v="1" ${stOff >= 0 ? 'disabled' : ''}>›</button></div>
    <div class="card"><div class="sub">${p.label}车子挣的（车费 − 车子花钱）</div><div class="big ${cur.carNet < 0 ? 'neg' : 'in'}">${fmt(cur.carNet)}</div><div style="font-size:1.05rem">${sum}</div></div>
    <div class="card">${cmp('💰 车费收入', cur.carIn, prev.carIn, true, 'in')}${cmp('🔧 车子花钱', cur.car, prev.car, false, 'car')}${cmp('🏠 家里花钱', cur.home, prev.home, false, 'home')}
      ${cur.otherIn || prev.otherIn ? cmp('➕ 其他收入', cur.otherIn, prev.otherIn, true, 'in') : ''}${cmp('💵 最后落下', cur.left, prev.left, true, cur.left < 0 ? 'neg' : '')}
      <div class="sub" style="margin-top:.5rem">出车 ${cur.work} 天${cur.work ? `，平均每天车费 ${fmt(Math.round(cur.carIn / cur.work))}` : ''}</div></div>`;
  if (rs.length) {
    const vals = [], labels = [], map = {};
    rs.filter(isCarIn).forEach(r => { const k = stKind === 'year' ? r.d.slice(0, 7) : r.d; map[k] = (map[k] || 0) + r.amt; });
    if (stKind === 'year') for (let i = 0; i < 12; i++) { vals.push(map[`${p.s.getFullYear()}-${pad(i + 1)}`] || 0); labels.push(i + 1 + '月'); }
    else for (let d = p.s; ymd(d) <= p.to; d = addDays(d, 1)) { vals.push(map[ymd(d)] || 0); labels.push(stKind === 'week' ? '周' + WD[d.getDay()] : String(d.getDate())); }
    h += `<div class="card"><h2>每${stKind === 'year' ? '月' : '天'}车费</h2><div class="sub">点柱子可以看金额</div>${barChart(vals, labels)}</div>
      <div class="card"><h2>🔧 车子的钱花在哪</h2>${tagList(rs, 'car')}</div>
      <div class="card"><h2>🏠 家里的钱花在哪</h2>${tagList(rs, 'home')}</div>`;
  }
  $('#stats').innerHTML = h;
}

/* ---------- 记一笔 ---------- */
let draft = null;
function openEntry(type, r){
  draft = r ? {id:r.id, type:r.type, tag:r.tag, amt:String(r.amt / 100), note:r.note || '', d:r.d, ts:r.ts}
            : {id:null, type, tag:TYPES[type].tags[0], amt:'', note:'', d:today()};
  renderEntry(); openSheet();
}
function renderEntry(){
  const T = TYPES[draft.type], t = today(), y = ymd(addDays(new Date(), -1)), by = ymd(addDays(new Date(), -2));
  const dayBtn = (d, l) => `<button data-act="day" data-v="${d}" class="${draft.d === d ? 'on' : ''}">${l}</button>`;
  $('#entry').innerHTML = `<div class="sheet-top"><div class="grab"></div><div class="sheet-h"><button class="link" data-act="close">取消</button>
      <b class="${draft.type}">${draft.id ? '改一笔' : '记' + T.name}</b>${draft.id ? '<button class="link danger" data-act="del">删除</button>' : '<span style="width:3rem"></span>'}</div></div>
    <div class="amt ${draft.type}" id="amtv"></div>
    <div class="tags ${draft.type}">${T.tags.map(g => `<button class="tag ${draft.tag === g ? 'on' : ''}" data-act="tag" data-v="${g}">${g}</button>`).join('')}</div>
    <div class="days">${dayBtn(t, '今天')}${dayBtn(y, '昨天')}${dayBtn(by, '前天')}<input type="date" id="dPick" value="${draft.d}" max="${t}"></div>
    <input id="note" placeholder="备注，可以不写" maxlength="20" enterkeyhint="done" value="${esc(draft.note)}">
    <div class="pad">${['1','2','3','4','5','6','7','8','9','.','0','del'].map(k => `<button data-act="key" data-v="${k}">${k === 'del' ? '⌫' : k}</button>`).join('')}</div>
    <button class="savebtn" style="background:var(--${draft.type})" data-act="save">✓ 记好了</button>`;
  showAmt();
}
function showAmt(){ const el = $('#amtv'); el.textContent = '¥' + (draft.amt || '0'); el.style.opacity = draft.amt ? 1 : .35; }
function pressKey(k){
  let s = draft.amt;
  if (k === 'del') s = s.slice(0, -1);
  else if (k === '.') { if (!s.includes('.')) s += s ? '.' : '0.'; }
  else { if (/\.\d{2}$/.test(s) || (!s.includes('.') && s.length >= 7)) return; s = s === '0' ? k : s + k; }
  draft.amt = s; showAmt();
}
async function saveEntry(){
  const amt = toCents(draft.amt);
  if (amt <= 0) return toast('先按数字，输入钱数', 'bad');
  // 一笔超过 1000 元，多确认一次，防止多按了一个 0
  if (amt >= 100000 && !await ask('确认一下钱数', `这一笔是 ${fmt(amt)}，对吗？`, [{t:'对，记上', v:1, primary:true}, {t:'我再看看', v:0}])) return;
  const rec = {id:draft.id || uid(), type:draft.type, tag:draft.tag, amt, note:$('#note').value.trim(), d:draft.d, ts:draft.ts || Date.now()};
  if (draft.id) S.recs[S.recs.findIndex(r => r.id === rec.id)] = rec; else S.recs.push(rec);
  save(); closeSheet(); render();
  if (draft.id) return toast('改好了 ✓');
  const dayTxt = rec.d === today() ? '今天' : md(rec.d);
  toast(rec.type === 'in' ? `记好了 ✓ ${dayTxt}车费一共 ${fmt(carInOn(rec.d))}` : `记好了 ✓ ${TYPES[rec.type].name} ${fmt(amt)}`, rec.type);
}

/* ---------- 备份 ---------- */
async function shareFile(name, text, type){
  const file = new File([text], name, {type});
  if (navigator.canShare && navigator.canShare({files:[file]})) {
    try { await navigator.share({files:[file]}); return true; } catch (e) { if (e.name === 'AbortError') return false; }
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  return true;
}
async function importFile(file){
  let data; try { data = JSON.parse(await file.text()); } catch (e) { data = null; }
  if (!data || !Array.isArray(data.recs)) return toast('这不是平安账本的备份文件', 'bad');
  if (!await ask('从备份恢复', `备份里有 ${data.recs.length} 笔账。恢复后，现在手机里的账会被换掉，确定吗？`, [{t:'确定恢复', v:1, danger:true}, {t:'不了', v:0}])) return;
  const f = fresh(); S = Object.assign(f, data, {settings:Object.assign(f.settings, data.settings)});
  save(); applyFont(); render(); toast('恢复好了 ✓');
}

  remDone: async id => {

    S.rems = S.rems.filter(x => x.id !== id); save(); renderMore();
  },
  backup: async () => {

  },
  restore: () => $('#fileIn').click(),

    shareFile(`平安账本-${today()}.csv`, '﻿' + rows.map(r => r.map(x => `"${String(x).replace(/"/g, '""')}"`).join(',')).join('\n'), 'text/csv');
  },

    if (!await ask('再确认一次', '真的要全部删掉吗？', [{t:'真的删掉', v:1, danger:true}, {t:'不删了', v:0, primary:true}])) return;
    S = fresh(); save(); applyFont(); render(); toast('已清空');
  },
};
document.addEventListener('click', e => { const el = e.target.closest('[data-act]'); if (!el) return; const fn = actions[el.dataset.act]; if (fn) fn(el.dataset.v); });
document.addEventListener('change', e => {
  const el = e.target;
  if (el.id === 'dPick' && el.value) actions.day(el.value > today() ? today() : el.value);
  else if (el.id === 'fileIn' && el.files[0]) { importFile(el.files[0]); el.value = ''; }
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.matches('input')) e.target.blur(); });
// 按住弹层顶部往下拖可以关掉
let drag = null;
document.addEventListener('touchstart', e => { if (e.target.closest('.sheet-top')) drag = {y: e.touches[0].clientY, dy: 0}; }, {passive: true});
document.addEventListener('touchmove', e => {
  if (!drag) return; drag.dy = Math.max(0, e.touches[0].clientY - drag.y);
  if (drag.dy > 6) { const s = $('#entry'); s.style.transition = 'none'; s.style.transform = `translateY(${drag.dy}px)`; }
}, {passive: true});
const endDrag = () => { if (!drag) return; const dy = drag.dy; drag = null; const s = $('#entry'); s.style.transition = ''; s.style.transform = ''; if (dy > 80) closeSheet(); };
document.addEventListener('touchend', endDrag);
document.addEventListener('touchcancel', endDrag);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') render(); });

applyFont();
go('today');
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('/mama/sw.js', {scope: '/mama/'});
navigator.storage?.persist?.().catch(() => {});
</script>
</body>
