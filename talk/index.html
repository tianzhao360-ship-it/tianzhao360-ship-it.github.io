<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="口语陪练">
<meta name="theme-color" content="#4f5bd5">
<link rel="manifest" href="/talk/manifest.webmanifest">
<link rel="preconnect" href="https://maas.qianwenaiapi.com" crossorigin>

<title>口语陪练</title>
<style>
:root{--bg:#f4f5fb;--card:#fff;--ink:#1d2033;--sub:#6b7085;--line:#e3e5ef;--pri:#4f5bd5;--pri2:#eceefd;--ok:#16a06b;--bad:#d9483b;--warn:#c98a12;--me:#4f5bd5;--meink:#fff;--top:env(safe-area-inset-top);--bot:env(safe-area-inset-bottom)}
@media (prefers-color-scheme:dark){:root{--bg:#111320;--card:#1b1e2e;--ink:#e9ebf5;--sub:#9aa0b8;--line:#2c3045;--pri:#8a94ff;--pri2:#262a48;--me:#5560dd;--meink:#fff}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
input,textarea,select{font:inherit;color:var(--ink)}
#app{display:flex;flex-direction:column;height:100dvh;padding-top:var(--top)}
header{display:flex;align-items:center;gap:8px;padding:10px 14px 8px;min-height:50px}
header h1{font-size:19px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .hb{padding:6px 11px;border-radius:16px;background:var(--pri2);color:var(--pri);font-size:14px;font-weight:600;white-space:nowrap}
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.view{display:none;padding:4px 14px 20px}
.view.on{display:block}
nav{display:flex;border-top:1px solid var(--line);background:var(--card);padding-bottom:var(--bot)}
nav button{flex:1;padding:8px 0 7px;font-size:12px;color:var(--sub);display:flex;flex-direction:column;align-items:center;gap:2px}
nav button svg{width:24px;height:24px}
nav button.on{color:var(--pri)}
svg{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
/* chat */
#chatv{padding-bottom:8px}
.msg{margin:10px 0;display:flex;flex-direction:column}
.msg.me{align-items:flex-end}
.bub{max-width:86%;padding:10px 13px;border-radius:18px;background:var(--card);box-shadow:0 1px 2px rgba(0,0,0,.05);word-wrap:break-word}
.me .bub{background:var(--me);color:var(--meink);border-bottom-right-radius:6px}
.ai .bub{border-bottom-left-radius:6px;max-width:92%}
.en{font-size:17px;line-height:1.45}
.en.blur{filter:blur(6px);user-select:none}
.zh{color:var(--sub);font-size:14px;margin-top:5px}
.tools{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap}
.tools button{font-size:13px;padding:4px 9px;border-radius:12px;background:var(--pri2);color:var(--pri);display:inline-flex;align-items:center;gap:3px}
.tools button svg{width:14px;height:14px}
.tools button.act{background:var(--pri);color:#fff}
.card{background:var(--card);border-radius:14px;padding:10px 12px;margin-top:6px;border:1px solid var(--line)}
.say{display:flex;align-items:center;gap:8px}
.say .t{flex:1;min-width:0}
.say b{font-weight:600;display:block}
.say span{color:var(--sub);font-size:14px}
.say small{display:block;color:var(--sub);font-size:12.5px}
.ib{width:34px;height:34px;border-radius:50%;background:var(--pri2);color:var(--pri);display:inline-flex;align-items:center;justify-content:center;flex:none}
.ib svg{width:17px;height:17px}
.ib.on{background:var(--pri);color:#fff}
.fix{max-width:86%;border-left:3px solid var(--warn);font-size:14.5px}
.fix .from{text-decoration:line-through;color:var(--sub)}
.fix .to{font-weight:600;color:var(--ok)}
.fix .why{color:var(--sub);font-size:13px}
.err{color:var(--bad);font-size:14px}
.typing:after{content:'▍';animation:bl 1s infinite}
@keyframes bl{50%{opacity:0}}
.empty{color:var(--sub);text-align:center;padding:26px 6px 6px}
.empty h2{color:var(--ink);font-size:20px;margin:0 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px}
.chip{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:7px 12px;font-size:14px;text-align:left}
#composer{display:none;align-items:flex-end;gap:6px;padding:8px 10px;background:var(--bg);border-top:1px solid var(--line)}
#composer.on{display:flex}
#txt{flex:1;resize:none;border:1px solid var(--line);background:var(--card);border-radius:20px;padding:9px 14px;max-height:120px;min-height:42px;font-size:16px;outline:none}
.cb{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;background:var(--pri2);color:var(--pri);font-weight:700;font-size:14px}
.cb svg{width:21px;height:21px}
#mic{background:var(--pri);color:#fff;width:48px;height:48px}
#mic.rec{background:var(--bad);animation:pu 1.2s infinite}
@keyframes pu{50%{box-shadow:0 0 0 8px rgba(217,72,59,.18)}}
#bar2{display:none;gap:6px;padding:0 10px 2px;overflow-x:auto}
#bar2.on{display:flex}
#bar2 button{white-space:nowrap;font-size:13px;padding:5px 11px;border-radius:14px;background:var(--card);border:1px solid var(--line);color:var(--sub)}
/* lists */
.sec{font-size:13px;color:var(--sub);margin:18px 2px 6px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.scene{background:var(--card);border-radius:16px;padding:13px;text-align:left;border:1px solid var(--line);min-height:84px}
.scene b{display:block;font-size:16px;margin-bottom:3px}
.scene span{font-size:13px;color:var(--sub);line-height:1.35;display:block}
.row{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:14px;padding:12px;margin-bottom:8px;border:1px solid var(--line)}
.row .t{flex:1;min-width:0}
.row .t div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t small{color:var(--sub);font-size:12.5px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:var(--card);border-radius:14px;padding:10px 4px;text-align:center;border:1px solid var(--line)}
.stat b{display:block;font-size:22px;color:var(--pri)}
.stat span{font-size:12px;color:var(--sub)}
.btn{display:block;width:100%;padding:12px;border-radius:14px;background:var(--pri);color:#fff;font-weight:600;font-size:16px;text-align:center}
.btn.g{background:var(--pri2);color:var(--pri)}
.btn.r{background:transparent;color:var(--bad);border:1px solid var(--line)}
.btns{display:flex;gap:8px;margin-top:10px}
.btns .btn{flex:1}
.set{background:var(--card);border-radius:14px;border:1px solid var(--line);overflow:hidden}
.set label,.set .li{display:flex;align-items:center;gap:10px;padding:11px 12px;border-bottom:1px solid var(--line);font-size:15px}
.set label:last-child,.set .li:last-child{border-bottom:0}
.set label>span:first-child,.set .li>span:first-child{flex:none;width:92px;color:var(--sub);font-size:14px}
.set input[type=text],.set input[type=password],.set select{flex:1;min-width:0;border:0;background:transparent;outline:none;font-size:15px;text-align:right}
.set input[type=range]{flex:1}
.set input[type=checkbox]{width:22px;height:22px;accent-color:var(--pri);margin-left:auto}
.note{font-size:13px;color:var(--sub);margin:6px 2px;line-height:1.55}
.seg{display:flex;background:var(--pri2);border-radius:12px;padding:3px;margin-left:auto}
.seg button{padding:5px 11px;border-radius:9px;font-size:14px;color:var(--pri)}
.seg button.on{background:var(--card);box-shadow:0 1px 2px rgba(0,0,0,.1);font-weight:600}
#search{width:100%;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:9px 12px;outline:none;margin-bottom:8px}
/* sheet */
#mask{position:fixed;inset:0;background:rgba(10,12,25,.42);display:none;z-index:20}
#sheet{position:fixed;left:0;right:0;bottom:0;max-height:calc(100dvh - var(--top) - 40px);overflow-y:auto;background:var(--bg);border-radius:20px 20px 0 0;padding:14px 16px calc(18px + var(--bot));z-index:21;transform:translateY(105%);transition:transform .22s}
#sheet.on{transform:none}
#sheet h3{margin:2px 0 10px;font-size:18px;display:flex;align-items:center}
#sheet h3 span{flex:1}
.pre{white-space:pre-wrap;font-size:15px;line-height:1.65}
.score{font-size:40px;font-weight:700;text-align:center}
.words{font-size:18px;line-height:1.7;text-align:center;margin:8px 0}
.w-ok{color:var(--ok)}.w-miss{color:var(--bad);text-decoration:underline}
#toast{position:fixed;left:50%;top:calc(var(--top) + 60px);transform:translateX(-50%);background:rgba(25,27,40,.92);color:#fff;padding:9px 16px;border-radius:18px;font-size:14px;z-index:40;display:none;max-width:86%;text-align:center}
/* call */
#call{position:fixed;inset:0;z-index:30;background:linear-gradient(180deg,#2c3390,#4f5bd5 60%,#6c63d8);color:#fff;display:none;flex-direction:column;align-items:center;padding:calc(var(--top) + 18px) 22px calc(var(--bot) + 22px)}
#call.on{display:flex}
#call .who{font-size:15px;opacity:.85}
#orb{margin-top:6vh;width:170px;height:170px;border-radius:50%;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;transition:transform .3s}
#orb i{width:110px;height:110px;border-radius:50%;background:#fff;opacity:.92;display:block}
#call.listen #orb{animation:br 1.4s infinite}
#call.speak #orb i{animation:sp .5s infinite alternate}
#call.think #orb i{opacity:.5}
@keyframes br{50%{transform:scale(1.08)}}
@keyframes sp{to{transform:scale(.86)}}
#cstate{margin-top:22px;font-size:18px;font-weight:600}
#ccap{margin-top:16px;font-size:18px;line-height:1.5;text-align:center;min-height:90px;max-height:32vh;overflow:auto}
#ccap small{display:block;opacity:.72;font-size:14px;margin-top:6px}
#cme{font-size:15px;opacity:.8;text-align:center;min-height:24px;margin-top:8px}
#call .cbtns{margin-top:auto;display:flex;gap:18px;align-items:center}
#call .cbtns button{width:58px;height:58px;border-radius:50%;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff}
#call .cbtns button svg{width:26px;height:26px}
#call .cbtns #cend{background:#e5484d;width:66px;height:66px}
.hide{display:none!important}
</style>
</head>
<body>
<div id="app">
  <header><h1 id="title">口语陪练</h1><span id="hbtns"></span></header>
  <main id="main">
    <section class="view on" id="chatv"></section>
    <section class="view" id="scenev"></section>
    <section class="view" id="bookv"></section>
    <section class="view" id="mev"></section>
  </main>
  <div id="bar2"></div>
  <div id="composer" class="on">
    <button class="cb" id="lang" title="切换识别语言">EN</button>
    <textarea id="txt" rows="1" placeholder="说英语，或用中文问“…怎么说”"></textarea>
    <button class="cb" id="send" style="display:none"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
    <button class="cb" id="mic"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
  </div>
  <nav id="nav">
    <button data-v="chatv" class="on"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></svg>对话</button>
    <button data-v="scenev"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="7" height="7" rx="1.5"/><rect x="14" y="4" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>场景</button>
    <button data-v="bookv"><svg viewBox="0 0 24 24"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11"/></svg>表达本</button>
    <button data-v="mev"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>我的</button>
  </nav>
</div>
<div id="mask"></div>
<div id="sheet"></div>
<div id="toast"></div>
<input type="file" id="impf" accept=".json,application/json" hidden>
<div id="call">
  <div class="who">和 Sam 通话中 · <span id="cscene"></span></div>
  <div id="orb"><i></i></div>
  <div id="cstate">准备中</div>
  <div id="ccap"></div>
  <div id="cme"></div>
  <div class="cbtns">
    <button id="clang">EN</button>
    <button id="cend"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <button id="chint"><svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5c.7.7 1 1.5 1 2.5h6c0-1 .3-1.8 1-2.5A6 6 0 0 0 12 3z"/></svg></button>
  </div>
</div>
<script>
'use strict';
const VER='1.2.1';
const KEY='talk.v1';
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const addDays=(ds,n)=>{const d=new Date(ds+'T12:00:00');d.setDate(d.getDate()+n);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const hasZh=s=>/[一-鿿]/.test(s);

const I={
 play:'<svg viewBox="0 0 24 24"><path d="M7 5l12 7-12 7z"/></svg>',
 slow:'<svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2M10 2h4"/></svg>',
 star:'<svg viewBox="0 0 24 24"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg>',
 mic:'<svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>',
 del:'<svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>',
 x:'<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>'
};

/* ---------- 数据 ---------- */
const PROV={
 deepseek:{name:'DeepSeek（国内直连，最省钱）',type:'openai',base:'https://api.deepseek.com',pick:[/flash/i,/chat/i,/^deepseek-v\d/i],fallback:'deepseek-v4-flash',url:'platform.deepseek.com'},
 qwen:{name:'阿里云百炼（推荐：一个密钥全包）',type:'openai',base:'https://dashscope.aliyuncs.com/compatible-mode/v1',pick:[/^qwen-plus$/,/^qwen-flash$/,/^qwen-turbo$/],fallback:'qwen-plus',url:'bailian.console.aliyun.com'},
 openai:{name:'OpenAI（需代理）',type:'openai',base:'https://api.openai.com/v1',pick:[/^gpt-4\.1-mini$/,/^gpt-4o-mini$/,/^gpt-[\d.]+-mini$/],fallback:'gpt-4.1-mini',url:'platform.openai.com'},
 anthropic:{name:'Claude（需代理）',type:'anthropic',base:'https://api.anthropic.com/v1',pick:[/haiku/i,/sonnet/i],fallback:'claude-haiku-5-5',url:'console.anthropic.com'},
 custom:{name:'其他 OpenAI 兼容接口',type:'openai',base:'',pick:[],fallback:'',url:''}
};
const FAST={qwen:[['qwen-plus','推荐：回复快，纠错质量好'],['qwen-flash','最省钱，速度差不多'],['deepseek-v4.1-flash-1017','DeepSeek，已自动关掉深度思考']]};
const OAI_VOICES=['marin','cedar','coral','nova','shimmer','sage','alloy','ash','ballad','echo','fable','onyx','verse'];
const LEVELS={easy:{n:'入门',p:'The learner is a beginner (about CEFR A2). Use very common words and short sentences (under 12 words each). Avoid idioms.'},mid:{n:'中级',p:'The learner is intermediate (about CEFR B1-B2). Use everyday vocabulary and natural but clear sentences; an occasional common idiom is fine.'},high:{n:'高级',p:'The learner is advanced (about CEFR C1). Talk like a native American adult would: idioms, phrasal verbs and slang are welcome.'}};
const SCENES=[
 {id:'free',t:'自由聊天',d:'想聊什么都行，也能用中文问“…怎么说”',p:''},
 {id:'daily',t:'日常闲聊',d:'像老朋友一样聊今天过得怎么样',p:'You are the learner\'s friendly American friend, catching up casually about their day, plans, food and hobbies.'},
 {id:'coffee',t:'咖啡店点单',d:'你是顾客，Sam 是咖啡师',p:'Role-play: you are a cheerful barista at a busy coffee shop in Seattle. The learner is the customer ordering. Ask about size, milk, for here or to go, name for the cup, and payment.'},
 {id:'food',t:'餐厅点餐',d:'入座、点菜、问推荐、结账',p:'Role-play: you are a server at a casual American restaurant. Greet the learner, take drinks and food orders, answer questions about the menu, check in later, and handle the check and tip.'},
 {id:'airport',t:'机场值机',d:'托运行李、选座位、过安检',p:'Role-play: you are an airline check-in agent at San Francisco airport, then a TSA officer. Ask for ID and booking, bags, seat preference, and give gate info.'},
 {id:'hotel',t:'酒店入住',d:'办入住、问设施、提要求',p:'Role-play: you are a front desk clerk at a hotel in Chicago. Check the learner in, explain breakfast, Wi-Fi and checkout time, and handle a small problem they raise.'},
 {id:'way',t:'问路与坐车',d:'找地铁站、打车、坐公交',p:'Role-play: you are a friendly local in New York. The learner stops you to ask for directions and how to get somewhere by subway or bus.'},
 {id:'doctor',t:'看医生',d:'描述症状、听医嘱',p:'Role-play: you are a doctor at an urgent care clinic in the US. Ask about the learner\'s symptoms, how long, allergies, and give simple advice.'},
 {id:'shop',t:'购物与退换',d:'试穿、问价、退货',p:'Role-play: you are a store associate at a clothing store in a US mall. Help the learner find sizes and colors, and handle a return or exchange.'},
 {id:'call',t:'打电话预约',d:'约理发、约看房、改时间',p:'Role-play: this is a phone call. You are a receptionist at a hair salon. The learner calls to book, reschedule or ask about prices. Spell names and confirm times like on a real call.'},
 {id:'job',t:'求职面试',d:'自我介绍、优缺点、经历追问',p:'Role-play: you are a friendly hiring manager interviewing the learner for an engineering internship at a US tech company. Ask one common interview question at a time and follow up on their answers.'},
 {id:'intro',t:'自我介绍',d:'第一次见面，聊背景和爱好',p:'You just met the learner at an international student welcome party. Get to know them: where they are from, what they study, hobbies. Share a little about yourself too.'},
 {id:'research',t:'介绍我的研究',d:'在学术会议上被外国同行追问',p:'Role-play: you are a curious American researcher at an academic conference coffee break. Ask the learner, a graduate student, about their research project: what problem it solves, how it works, results, and challenges. Keep questions accessible and encouraging.'},
 {id:'campus',t:'校园与室友',d:'和室友、同学、导师沟通',p:'Role-play: you are the learner\'s American roommate at a US university. Chat about classes, chores, weekend plans, and sort out small roommate issues.'},
 {id:'opinion',t:'观点讨论',d:'聊话题、讲理由、学会反驳',p:'Pick an interesting everyday debate topic (for example remote work, social media, cities vs small towns). Ask for the learner\'s opinion, ask why, and politely push back so they keep explaining.'},
 {id:'custom',t:'自定义场景',d:'自己描述一个想练的场景',p:null}
];
const ALI_VOICES=[['Jennifer','Jennifer · 美式女声'],['Aiden','Aiden · 美式男声'],['Cherry','Cherry · 中英双语女声'],['Ethan','Ethan · 中英双语男声']];
const DEF={v:2,cfg:{prov:'qwen',keys:{},model:{},base:'',oaiKey:'',aliKey:'',level:'mid',rate:1,autoplay:true,showZh:false,blurEn:false,tts:'auto',pause:'mid',aliRoot:'',sysVoice:'',oaiVoice:'marin',aliVoice:'Jennifer',asr:'auto',lang:'en'},sessions:[],cur:null,book:[],days:{},turns:0};
let S;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){S=null}

function listenSys(lang,onInterim){

  let fin='',inter='',err='';

  r.onresult=e=>{fin='';inter='';for(const x of e.results){if(x.isFinal)fin+=x[0].transcript;else inter+=x[0].transcript}onInterim&&onInterim((fin+inter).trim())};
  r.onerror=e=>{err=e.error};
  r.onend=()=>{REC=null;const t=(fin||inter).trim();
   if(t)return resolve(t);
   if(err==='not-allowed'||err==='service-not-allowed')return reject(new Error(err==='not-allowed'&&!STANDALONE?'没有麦克风权限，请在系统设置里允许，或再点一次':NO_ASR()));

async function recordWav(onInterim){

 const src=ac.createMediaStreamSource(stream),proc=ac.createScriptProcessor(4096,1,1),rate=ac.sampleRate;
 const chunks=[];let heard=false,quiet=0,el=0,floor=0,nf=0,cancelled=false,fin;
 const finished=new Promise(r=>fin=r);
 onInterim&&onInterim('','正在听…说完停一下就会自动发送');
 proc.onaudioprocess=e=>{
  const d=e.inputBuffer.getChannelData(0);chunks.push(new Float32Array(d));
  let s=0;for(let i=0;i<d.length;i++)s+=d[i]*d[i];const rms=Math.sqrt(s/d.length),dt=d.length/rate*1000;el+=dt;
  if(el<300){floor+=rms;nf++;return}
  const th=Math.max(.012,(nf?floor/nf:0)*3);
  if(rms>th){if(!heard)onInterim&&onInterim('','在听…');heard=true;quiet=0}else if(heard)quiet+=dt;
  if((heard&&quiet>PAUSE[S.cfg.pause||'mid'])||el>60000||(!heard&&el>9000))stop();
 };
 src.connect(proc);proc.connect(ac.destination);
 function stop(){if(!fin)return;const f=fin;fin=null;try{proc.disconnect();src.disconnect()}catch(e){}stream.getTracks().forEach(t=>t.stop());setSession('playback');f()}

 const w=(p,s)=>[...s].forEach((c,i)=>d.setUint8(p+i,c.charCodeAt(0)));
 w(0,'RIFF');d.setUint32(4,36+n*2,true);w(8,'WAVEfmt ');d.setUint32(16,16,true);d.setUint16(20,1,true);d.setUint16(22,1,true);d.setUint32(24,R,true);d.setUint32(28,R*2,true);d.setUint16(32,2,true);d.setUint16(34,16,true);w(36,'data');d.setUint32(40,n*2,true);
 for(let i=0;i<n;i++){const a=Math.floor(i*ratio),z=Math.min(len,Math.floor((i+1)*ratio));let s=0;for(let j=a;j<z;j++)s+=all[j];const v=Math.max(-1,Math.min(1,s/Math.max(1,z-a)));d.setInt16(44+i*2,v<0?v*0x8000:v*0x7fff,true)}

/* 跟读打分 */
const CONTR={"i'm":"i am","you're":"you are","we're":"we are","they're":"they are","he's":"he is","she's":"she is","it's":"it is","that's":"that is","what's":"what is","where's":"where is","there's":"there is","here's":"here is","let's":"let us","i've":"i have","you've":"you have","we've":"we have","they've":"they have","i'll":"i will","you'll":"you will","we'll":"we will","it'll":"it will","i'd":"i would","you'd":"you would","don't":"do not","doesn't":"does not","didn't":"did not","can't":"can not","cannot":"can not","won't":"will not","isn't":"is not","aren't":"are not","wasn't":"was not","weren't":"were not","haven't":"have not","hasn't":"has not","couldn't":"could not","wouldn't":"would not","shouldn't":"should not","gonna":"going to","wanna":"want to","gotta":"got to","ok":"okay"};
const NUMW=['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen','twenty'];
const words=s=>clean(s).toLowerCase().replace(/[’‘]/g,"'").replace(/[^a-z0-9' ]+/g,' ').split(' ').flatMap(w=>{w=w.replace(/^'+|'+$/g,'');if(!w)return [];if(CONTR[w])return CONTR[w].split(' ');if(/^\d+$/.test(w)&&+w<=20)return [NUMW[+w]];return [w]});
function compare(target,said){
 const a=words(target),b=words(said),n=a.length,m=b.length;
 const dp=Array.from({length:n+1},()=>new Array(m+1).fill(0));
 for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)dp[i][j]=a[i]===b[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
 const ok=new Array(n).fill(false);let i=0,j=0;
 while(i<n&&j<m){if(a[i]===b[j]){ok[i]=true;i++;j++}else if(dp[i+1][j]>=dp[i][j+1])i++;else j++}
 const hit=ok.filter(Boolean).length;
 const score=n?Math.round(100*hit/Math.max(n,(n+m)/2)):0;
 const toks=clean(target).split(' ');let k=0;
 const html=toks.map(t=>{const w=words(t);if(!w.length)return esc(t);let good=true;for(let q=0;q<w.length;q++)if(!ok[k++])good=false;return `<span class="${good?'w-ok':'w-miss'}">${esc(t)}</span>`}).join(' ');
 return {score,html};
}
function openShadow(en,zh){
 sheet(sheetHead('跟读')+`<div class="card" style="text-align:center"><div class="words" id="sw">${esc(en)}</div>${zh?`<div class="zh">${esc(zh)}</div>`:''}</div>
 <div class="btns"><button class="btn g" data-a="sp">${'听原声'}</button><button class="btn g" data-a="sps">慢速听</button></div>
 <div id="sres" class="note" style="text-align:center;min-height:70px;margin-top:12px">先听一遍，再点下面的按钮跟着说</div>
 <button class="btn" data-a="srec" id="srec">开始跟读</button>`);
 sheet.shadow={en,zh};
}
async function doShadow(){
 const {en}=sheet.shadow,res=$('#sres'),b=$('#srec');
 if(REC){REC.stop();return}
 if(LISTENING)return;
 stopSpeak();b.textContent='说完点这里结束';b.style.background='var(--bad)';
 try{
  const said=await listen('en',(t,st)=>res.textContent=st||t||'正在听…');
  b.textContent='再说一次';b.style.background='';
  if(!said){res.textContent='没听到声音，再试一次';return}
  const {score,html}=compare(en,said);
  $('#sw').innerHTML=html;
  res.innerHTML=`<div class="score" style="color:${score>=85?'var(--ok)':score>=60?'var(--warn)':'var(--bad)'}">${score}</div><div>${score>=85?'很棒，非常清楚！':score>=60?'不错，红色的词再练练':'红色的词没听清，慢速听一遍再来'}</div><div style="margin-top:4px">识别到：${esc(said)}</div>`;
  tickTime();save();return score;
 }catch(e){b.textContent='再试一次';b.style.background='';res.textContent=e.message}
}

function drillMark(ok){
 const b=drill.q[drill.i];const real=S.book.find(x=>x.id===b.id);
 if(real){if(ok){real.box=Math.min((real.box||0)+1,BOX.length-1);real.due=addDays(today(),BOX[real.box])}else{real.box=0;real.due=addDays(today(),1)}}
 if(ok)drill.done++;else drill.q.push(b);
 drill.i++;drill.show=false;save();drillRender();
}

 if(t.dataset.chip){txt.value=t.dataset.chip;sendText(t.dataset.chip);return}

 const a=t.dataset.a,msgEl=t.closest('.msg'),s=curSess();

  case 'addall':{const o=sheet.review;if(!o)return;let n=0;o.fix.forEach(f=>{if(!inBook(f.to)){addBook({en:f.to,zh:'改地道：'+f.from,note:f.why},true);n++}});o.say.forEach(x=>{if(!inBook(x.en)){addBook(x,true);n++}});document.querySelectorAll('#sheet .say [data-a=fav]').forEach(b=>b.classList.add('on'));toast(`收藏了 ${n} 条`);return}
  case 'topic':{const s2=newSession('opinion');go('chatv');return runAI(s2,'(Pick a fun, random everyday topic, different from remote work, and start chatting about it with a short opener and a question.)')}
  case 'custgo':{const v=($('#cust').value||'').trim();if(!v)return toast('写一句场景描述');closeSheet();const s2=newSession('custom',v);go('chatv');return runAI(s2,'(Start the role-play now: say your short opening line in character.)')}
  case 'sp':return speak(sheet.shadow.en);
  case 'sps':return speak(sheet.shadow.en,true);
  case 'srec':return doShadow();
  case 'drill':return startDrill();
  case 'dshow':drill.show=true;$('#sw').style.filter='';return speak(sheet.shadow.en);
  case 'dok':return drillMark(true);
  case 'dno':return drillMark(false);
  case 'bdel':{const id=t.closest('[data-id]').dataset.id;S.book=S.book.filter(b=>b.id!==id);save();return renderBook()}
  case 'open':{S.cur=t.closest('[data-sid]').dataset.sid;save();return go('chatv')}
  case 'sdel':{const id=t.closest('[data-sid]').dataset.sid;if(!confirm('删除这段对话？'))return;S.sessions=S.sessions.filter(x=>x.id!==id);if(S.cur===id)S.cur=null;save();return renderMe()}
  case 'test':{readCfg();toast('连接中…',8000);try{if(aliKey())await detectAli();const r=await askAI('Reply with exactly: OK','ping');toast('连接成功：'+(S.cfg.model[S.cfg.prov])+' 回复 '+r.trim().slice(0,20),3500);renderMe()}catch(err){toast(err.message,5000)}return}
  case 'models':{readCfg();try{
   if(S.cfg.prov==='qwen')await detectAli();
   const all=(await listModels()).sort(),rec=(FAST[S.cfg.prov]||[]).filter(([id])=>all.includes(id));
   const rest=all.filter(id=>!rec.some(([r])=>r===id)).map(id=>[id,'']);
   sheet(sheetHead('选择模型')+(rec.length?'<div class="note">前几个是推荐的，实测首字最快约 1.4 秒</div>':'')+rec.concat(rest).map(([id,tip])=>`<button class="row" style="width:100%;text-align:left" data-a="pickm" data-m="${esc(id)}"><div class="t"><div>${esc(id)}${id===S.cfg.model[S.cfg.prov]?' ✓':''}</div>${tip?`<small>${tip}</small>`:''}</div></button>`).join(''));
  }catch(err){toast(err.message,5000)}return}
  case 'pickm':S.cfg.model[S.cfg.prov]=t.dataset.m;save();closeSheet();renderMe();return toast('已选择 '+t.dataset.m);
  case 'testv':return speak(t.textContent);
  case 'export':{const d=structuredClone(S);d.cfg.keys={};d.cfg.oaiKey='';d.cfg.aliKey='';const name='口语陪练备份-'+today()+'.json';const file=new File([JSON.stringify(d)],name,{type:'application/json'});
   if(navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file]}).catch(()=>{});return}
   const u=URL.createObjectURL(file);const l=document.createElement('a');l.href=u;l.download=name;document.body.appendChild(l);l.click();l.remove();return}
  case 'import':return $('#impf').click();
 }
});
document.body.addEventListener('input',e=>{if(e.target.id==='search'){renderBook.q=e.target.value;const p=e.target.selectionStart;renderBook();const n=$('#search');n.focus();n.setSelectionRange(p,p)}});
function readCfg(){
 const g=id=>{const el=$('#'+id);return el?el.value.trim():null};
 const k=g('c-key');if(k!==null)S.cfg.keys[S.cfg.prov]=cleanKey(k);
 const m=g('c-model');if(m!==null)S.cfg.model[S.cfg.prov]=m;
 const b=g('c-base');if(b!==null)S.cfg.base=b;
 const ok=$('#c-okey');if(ok&&!ok.disabled)S.cfg.oaiKey=cleanKey(ok.value);
 const ak=$('#c-akey');if(ak&&!ak.disabled)S.cfg.aliKey=cleanKey(ak.value);
 save();
}
$('#mev').addEventListener('change',e=>{
 const id=e.target.id;
 if(id==='c-prov'){readCfg();S.cfg.prov=e.target.value;save();updLangBtn();return renderMe()}
 if(id==='c-key'){readCfg();updLangBtn();renderMe();if(S.cfg.prov==='qwen'&&aliKey()){S.cfg.model.qwen='';detectAli().then(renderMe,err=>toast(err.message,4000))}return}
 if(['c-model','c-base'].includes(id))return readCfg();
 if(['c-okey','c-akey'].includes(id)){readCfg();updLangBtn();renderMe();if(id==='c-akey'&&aliKey())detectAli().then(renderMe,err=>toast(err.message,4000));return}
 if(id==='c-tts'||id==='c-asr'){S.cfg[id.slice(2)]=e.target.value;save();updLangBtn();renderMe();
  const want=e.target.value,got=id==='c-tts'?ttsEngine():asrEngine();
  if(want!=='auto'&&want!==got)toast((want==='ali'?'先填阿里云百炼密钥':want==='openai'?'先填 OpenAI 密钥':'这个浏览器不支持系统识别')+'，现在用的是'+(got?ENG_NAME[got]:'无'),3500);return}
 if(id==='c-avoice'){S.cfg.aliVoice=e.target.value;save();return speak('Hi, this is how I sound.')}
 if(id==='c-voice'){S.cfg.sysVoice=e.target.value;save();return speak('Hi, this is how I sound.')}
 if(id==='c-ovoice'){S.cfg.oaiVoice=e.target.value;save();return speak('Hi, this is how I sound.')}
 if(id==='c-auto')S.cfg.autoplay=e.target.checked;
 if(id==='c-zh')S.cfg.showZh=e.target.checked;
 if(id==='c-blur')S.cfg.blurEn=e.target.checked;
 save();
});
$('#mev').addEventListener('input',e=>{if(e.target.id==='c-rate'){S.cfg.rate=+e.target.value;$('#ratev').textContent=S.cfg.rate.toFixed(2);save()}});
$('#mev').addEventListener('click',e=>{
 const b=e.target.closest('.seg button');if(!b)return;const seg=b.parentElement.id;
 if(seg==='c-level')S.cfg.level=b.dataset.v;
 if(seg==='c-pause')S.cfg.pause=b.dataset.v;
 save();renderMe();
});
$('#impf').onchange=async e=>{
 const f=e.target.files[0];if(!f)return;
 try{const d=JSON.parse(await f.text());if(!d||!Array.isArray(d.sessions)||!Array.isArray(d.book))throw 0;
  if(!confirm(`恢复备份：${d.sessions.length} 段对话、${d.book.length} 条表达。当前数据会被替换（密钥保留），继续？`))return;
  const keep={keys:S.cfg.keys,oaiKey:S.cfg.oaiKey};S=Object.assign(structuredClone(DEF),d);S.cfg=Object.assign(structuredClone(DEF.cfg),d.cfg||{},keep);save();toast('已恢复');renderMe();
 }catch(err){toast('这不是口语陪练的备份文件')}
 e.target.value='';
};
document.addEventListener('visibilitychange',()=>{if(document.hidden){if(REC)REC.abort();stopSpeak();lastAct=0}});

if(!S.cur||!curSess()){const s=S.sessions.find(x=>x.msgs.length===0);S.cur=s?s.id:null}
go('chatv');
/* 预热连接：打开或切回应用时先和服务器握好手，第一句话就不用等建连 */
let warmAt=0;
function warm(){
 if(!apiKey()&&!aliKey())return;const n=Date.now();if(n-warmAt<60000)return;warmAt=n;
 (aliKey()&&!S.cfg.aliRoot?detectAli():Promise.resolve()).catch(()=>{}).then(()=>{
  if(apiKey())fetch(base()+'/models',{headers:authHeaders()}).catch(()=>{});
  if(aliKey()&&base().indexOf(aliRoot())!==0)fetch(aliRoot()+'/compatible-mode/v1/models',{headers:{authorization:'Bearer '+aliKey()}}).catch(()=>{});
 });
}
warm();document.addEventListener('visibilitychange',()=>{if(!document.hidden)warm()});
if('serviceWorker' in navigator)navigator.serviceWorker.register('/talk/sw.js',{scope:'/talk/'}).catch(()=>{});
</script>
</body>
</html>
