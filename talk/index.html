<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="口语陪练">
<meta name="theme-color" content="#4f5bd5">
<link rel="manifest" href="/talk/manifest.webmanifest">
<link rel="preconnect" href="https://maas.qianwenaiapi.com" crossorigin>
<link rel="preconnect" href="https://dashscope.aliyuncs.com" crossorigin>
<link rel="apple-touch-icon" href="/talk/icon-180.png">
<title>口语陪练</title>
<style>
:root{--lkc:#e8590c;--bg:#f4f5fb;--card:#fff;--ink:#1d2033;--sub:#6b7085;--line:#e3e5ef;--pri:#4f5bd5;--pri2:#eceefd;--ok:#16a06b;--bad:#d9483b;--warn:#c98a12;--me:#4f5bd5;--meink:#fff;--top:env(safe-area-inset-top);--bot:env(safe-area-inset-bottom)}
@media (prefers-color-scheme:dark){:root{--lkc:#ff8c42;--bg:#111320;--card:#1b1e2e;--ink:#e9ebf5;--sub:#9aa0b8;--line:#2c3045;--pri:#8a94ff;--pri2:#262a48;--me:#5560dd;--meink:#fff}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
input,textarea,select{font:inherit;color:var(--ink)}
#app{display:flex;flex-direction:column;height:100dvh;padding-top:var(--top)}
header{display:flex;align-items:center;gap:8px;padding:10px 14px 8px;min-height:50px}
header h1{font-size:19px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .hb{padding:6px 11px;border-radius:16px;background:var(--pri2);color:var(--pri);font-size:14px;font-weight:600;white-space:nowrap}
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.view{display:none;padding:4px 14px 20px}
.view.on{display:block}
nav{display:flex;border-top:1px solid var(--line);background:var(--card);padding-bottom:var(--bot)}
nav button{flex:1;padding:8px 0 7px;font-size:12px;color:var(--sub);display:flex;flex-direction:column;align-items:center;gap:2px}
nav button svg{width:24px;height:24px}
nav button.on{color:var(--pri)}
svg{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
/* chat */
#chatv{padding-bottom:8px}
.msg{margin:10px 0;display:flex;flex-direction:column}
.msg.me{align-items:flex-end}
.bub{max-width:86%;padding:10px 13px;border-radius:18px;background:var(--card);box-shadow:0 1px 2px rgba(0,0,0,.05);word-wrap:break-word}
.me .bub{background:var(--me);color:var(--meink);border-bottom-right-radius:6px}
.ai .bub{border-bottom-left-radius:6px;max-width:92%}
.en{font-size:17px;line-height:1.45}
.en.blur{filter:blur(6px);user-select:none}
.zh{color:var(--sub);font-size:14px;margin-top:5px}
.tools{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap}
.tools button{font-size:13px;padding:4px 9px;border-radius:12px;background:var(--pri2);color:var(--pri);display:inline-flex;align-items:center;gap:3px}
.tools button svg{width:14px;height:14px}
.tools button.act{background:var(--pri);color:#fff}
.card{background:var(--card);border-radius:14px;padding:10px 12px;margin-top:6px;border:1px solid var(--line)}
.say{display:flex;align-items:center;gap:8px}
.say .t{flex:1;min-width:0}
.say b{font-weight:600;display:block}
.say span{color:var(--sub);font-size:14px}
.say small{display:block;color:var(--sub);font-size:12.5px}
.ib{width:34px;height:34px;border-radius:50%;background:var(--pri2);color:var(--pri);display:inline-flex;align-items:center;justify-content:center;flex:none}
.ib svg{width:17px;height:17px}
.ib.on{background:var(--pri);color:#fff}
.fix{max-width:86%;border-left:3px solid var(--warn);font-size:14.5px}
.fix .from{text-decoration:line-through;color:var(--sub)}
.fix .to{font-weight:600;color:var(--ok)}
.fix [data-a=pf]{float:right;margin:0 0 4px 8px}
.fix .why{color:var(--sub);font-size:13px}
.err{color:var(--bad);font-size:14px}
.typing:after{content:'▍';animation:bl 1s infinite}
@keyframes bl{50%{opacity:0}}
.empty{color:var(--sub);text-align:center;padding:26px 6px 6px}
.empty h2{color:var(--ink);font-size:20px;margin:0 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px}
.chip{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:7px 12px;font-size:14px;text-align:left}
#composer{display:none;align-items:flex-end;gap:6px;padding:8px 10px;background:var(--bg);border-top:1px solid var(--line)}
#composer.on{display:flex}
#txt{flex:1;resize:none;border:1px solid var(--line);background:var(--card);border-radius:20px;padding:9px 14px;max-height:120px;min-height:42px;font-size:16px;outline:none}
.cb{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;background:var(--pri2);color:var(--pri);font-weight:700;font-size:14px}
.cb svg{width:21px;height:21px}
#mic{background:var(--pri);color:#fff;width:48px;height:48px}
#mic.rec{background:var(--bad);animation:pu 1.2s infinite}
@keyframes pu{50%{box-shadow:0 0 0 8px rgba(217,72,59,.18)}}
#bar2{display:none;gap:6px;padding:0 10px 2px;overflow-x:auto}
#bar2.on{display:flex}
#bar2 button{white-space:nowrap;font-size:13px;padding:5px 11px;border-radius:14px;background:var(--card);border:1px solid var(--line);color:var(--sub)}
/* lists */
.sec{font-size:13px;color:var(--sub);margin:18px 2px 6px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.scene{background:var(--card);border-radius:16px;padding:13px;text-align:left;border:1px solid var(--line);min-height:84px}
.scene b{display:block;font-size:16px;margin-bottom:3px}
.scene span{font-size:13px;color:var(--sub);line-height:1.35;display:block}
.row{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:14px;padding:12px;margin-bottom:8px;border:1px solid var(--line)}
.row .t{flex:1;min-width:0}
.row .t div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t small{color:var(--sub);font-size:12.5px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:var(--card);border-radius:14px;padding:10px 4px;text-align:center;border:1px solid var(--line)}
.stat b{display:block;font-size:22px;color:var(--pri)}
.stat span{font-size:12px;color:var(--sub)}
.btn{display:block;width:100%;padding:12px;border-radius:14px;background:var(--pri);color:#fff;font-weight:600;font-size:16px;text-align:center}
.btn.g{background:var(--pri2);color:var(--pri)}
.btn.r{background:transparent;color:var(--bad);border:1px solid var(--line)}
.btns{display:flex;gap:8px;margin-top:10px}
.btns .btn{flex:1}
.set{background:var(--card);border-radius:14px;border:1px solid var(--line);overflow:hidden}
.set label,.set .li{display:flex;align-items:center;gap:10px;padding:11px 12px;border-bottom:1px solid var(--line);font-size:15px}
.set label:last-child,.set .li:last-child{border-bottom:0}
.set label>span:first-child,.set .li>span:first-child{flex:none;width:92px;color:var(--sub);font-size:14px}
.set input[type=text],.set input[type=password],.set select{flex:1;min-width:0;border:0;background:transparent;outline:none;font-size:15px;text-align:right}
.set input[type=range]{flex:1}
.set input[type=checkbox]{width:22px;height:22px;accent-color:var(--pri);margin-left:auto}
.note{font-size:13px;color:var(--sub);margin:6px 2px;line-height:1.55}
.seg{display:flex;background:var(--pri2);border-radius:12px;padding:3px;margin-left:auto}
.seg button{padding:5px 11px;border-radius:9px;font-size:14px;color:var(--pri)}
.seg button.on{background:var(--card);box-shadow:0 1px 2px rgba(0,0,0,.1);font-weight:600}
#search{width:100%;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:9px 12px;outline:none;margin-bottom:8px}
/* sheet */
#mask{position:fixed;inset:0;background:rgba(10,12,25,.42);display:none;z-index:40}
#sheet{position:fixed;left:0;right:0;bottom:0;max-height:calc(100dvh - var(--top) - 40px);overflow-y:auto;background:var(--bg);border-radius:20px 20px 0 0;padding:14px 16px calc(18px + var(--bot));z-index:21;transform:translateY(105%);transition:transform .22s;z-index:41}
#sheet.on{transform:none}
#sheet h3{margin:2px 0 10px;font-size:18px;display:flex;align-items:center}
#sheet h3 span{flex:1}
.pre{white-space:pre-wrap;font-size:15px;line-height:1.65}
.score{font-size:40px;font-weight:700;text-align:center}
.words{font-size:18px;line-height:1.7;text-align:center;margin:8px 0}
.w-ok{color:var(--ok)}.w-miss{color:var(--bad);text-decoration:underline}
#toast{position:fixed;left:50%;top:calc(var(--top) + 60px);transform:translateX(-50%);background:rgba(25,27,40,.92);color:#fff;padding:9px 16px;border-radius:18px;font-size:14px;z-index:60;display:none;max-width:86%;text-align:center}
/* call */
#call{position:fixed;inset:0;z-index:30;background:linear-gradient(180deg,#252b7a,#4450c8 55%,#6a5fd6);color:#fff;display:none;flex-direction:column;align-items:center;padding:calc(var(--top) + 14px) 20px calc(var(--bot) + 18px);user-select:none;-webkit-user-select:none}
#call.on{display:flex}
#call .top{width:100%;display:flex;justify-content:space-between;align-items:center;font-size:14px;opacity:.88}
#call .top b{font-size:16px;font-weight:600}
#ctime{font-variant-numeric:tabular-nums}
#orb{margin-top:3.5vh;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center;flex:none;position:relative;transition:transform .08s linear}
#orb i{width:104px;height:104px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;color:#4450c8;font-style:normal;font-size:14px;font-weight:700;text-align:center;line-height:1.25;padding:8px}
#call.speak #orb i{animation:sp .45s infinite alternate}
#call.think #orb i{opacity:.6;animation:th 1s infinite}
#call.idle #orb{animation:br 1.8s infinite}
@keyframes br{50%{transform:scale(1.06)}}
@keyframes sp{to{transform:scale(.88)}}
@keyframes th{50%{opacity:.35}}
#cstate{margin-top:14px;font-size:16px;font-weight:600;min-height:22px;text-align:center}
#ccap{margin-top:12px;width:100%;font-size:19px;line-height:1.45;text-align:center;flex:1;min-height:60px;overflow:auto}
#ccap small{display:block;opacity:.75;font-size:14px;margin-top:6px}
#ccap .tip{display:inline-block;margin-top:10px;font-size:14px;background:rgba(255,255,255,.16);border-radius:12px;padding:5px 10px;text-align:left}
#ccap.hidecap .en{filter:blur(7px)}
#cme{font-size:15px;opacity:.82;text-align:center;min-height:22px;margin:6px 0 10px;max-height:66px;overflow:auto;width:100%}
#call .tools2{display:flex;gap:10px;justify-content:center;width:100%;margin-bottom:16px}
#call .tools2 button{flex:1;max-width:76px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:#fff;opacity:.92}
#call .tools2 button span{width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center}
#call .tools2 button.on span{background:#fff;color:#4450c8}
#call .tools2 svg{width:21px;height:21px}
#call .cbtns{display:flex;gap:30px;align-items:center}
#call .cbtns button{width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;font-size:14px}
#call .cbtns button.on{background:#fff;color:#4450c8}
#call .cbtns button svg{width:24px;height:24px}
#call .cbtns #cend{background:#e5484d;width:68px;height:68px}
#call .cbtns #cend svg{width:30px;height:30px;transform:rotate(135deg)}
/* 录音条 */
#recbar{display:none;flex:1;align-items:center;gap:8px;min-height:42px;padding:6px 14px;border-radius:20px;background:var(--card);border:1.5px solid var(--bad);font-size:14px;color:var(--sub);line-height:1.35}
#recbar i{width:9px;height:9px;border-radius:50%;background:var(--bad);flex:none;animation:bl 1s infinite}
#composer.recording #recbar{display:flex}
#composer.recording #txt,#composer.recording #send,#composer.recording #callbtn{display:none!important}
#composer.recording #lang{background:var(--bad);color:#fff}
.note-msg{align-self:center;text-align:center;font-size:13px;color:var(--sub);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:7px 12px;margin:12px auto;max-width:92%}
.note-msg button{color:var(--pri);font-weight:600;margin-left:6px}
.hide{display:none!important}
/* 剧本场景 */
.sic{width:44px;height:44px;border-radius:14px;background:var(--c);color:#fff;display:inline-flex;align-items:center;justify-content:center;flex:none}
.sic svg{width:24px;height:24px}
.srow{width:100%;display:flex;align-items:center;gap:12px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:11px 12px;margin-bottom:8px}
.srow .t{flex:1;min-width:0}.srow .t b{display:block;font-size:16px}.srow .t small{display:block;color:var(--sub);font-size:12.5px;line-height:1.45}
.srow.nx{border-color:var(--c,var(--pri));box-shadow:0 0 0 1px var(--c,var(--pri)) inset}
.srow.cont{border-color:var(--pri)}
.sst{color:var(--warn);font-size:13px;letter-spacing:1px;flex:none}
.shero{width:100%;display:flex;gap:14px;align-items:center;text-align:left;color:#fff;border-radius:18px;padding:16px 14px;margin:2px 0 6px;background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 60%,#1d2033))}
.shero .sic{background:rgba(255,255,255,.22);width:52px;height:52px}
.shero .t{flex:1;min-width:0}.shero-lv{font-size:12.5px;opacity:.85}.shero-t{font-size:20px;font-weight:700;margin:2px 0}.shero-p{font-size:13px;opacity:.92;line-height:1.5}
.chap{margin:18px 2px 8px}.chap-h{display:flex;align-items:baseline;justify-content:space-between}.chap-h b{font-size:17px}.chap-h em{font-style:normal;font-weight:700}
.stage{position:relative;background:var(--card);border:1px dashed var(--line);border-radius:14px;padding:12px 12px 12px 14px;margin:8px 0;font-size:15px;line-height:1.7;color:var(--ink)}
.stage .tag{margin-right:6px}
.whoc{display:flex;align-items:center;gap:10px}.whoc .t{flex:1}.whoc small{display:block;color:var(--sub);font-size:13px}
.av{width:40px;height:40px;border-radius:50%;color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;flex:none}
.rl{margin:6px 0 0;padding-left:20px;line-height:1.8}
.prop{margin:8px 0;border-radius:14px;padding:14px 14px 12px}
.prop-h{font-weight:800;letter-spacing:1.5px;margin-bottom:8px;font-size:15px}
.prop-r{display:flex;justify-content:space-between;gap:10px;padding:4px 0;font-size:14.5px}.prop-r b{font-weight:600;text-align:right}
.prop-n{margin-top:8px;font-size:12.5px;opacity:.8}
.prop-menu{background:#26352c;color:#f3efe2;font-family:Georgia,"Times New Roman",serif}.prop-menu .prop-h{text-align:center;font-size:17px;border-bottom:1px solid rgba(243,239,226,.3);padding-bottom:8px}
.prop-receipt{background:#fffdf7;color:#222;font-family:"SF Mono",Menlo,monospace;border:1px solid #e6e1d3;box-shadow:0 1px 3px rgba(0,0,0,.08)}.prop-receipt .prop-h{text-align:center;border-bottom:1px dashed #bbb;padding-bottom:8px}.prop-receipt .prop-n{border-top:1px dashed #bbb;padding-top:8px}
.prop-ticket{background:#fff;color:#1d2033;border-left:8px solid #4f5bd5;box-shadow:0 1px 3px rgba(0,0,0,.1)}.prop-ticket .prop-h{color:#4f5bd5}
.prop-tag{background:#ffe066;color:#2b2200;border-radius:6px 14px 14px 6px}.prop-tag .prop-r b{font-size:16px}
.prop-note{background:#fff6c7;color:#3a3300;transform:rotate(-.6deg);box-shadow:0 2px 4px rgba(0,0,0,.08)}
.sstick{position:sticky;top:0;z-index:5;background:var(--bg);padding:2px 0 6px;margin:0 -2px}
.sbar{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 10px}
.sbar .sic{width:36px;height:36px;border-radius:11px}.sbar .sic svg{width:20px;height:20px}
.sbar .t{flex:1;min-width:0}.sbar .t b{display:block;font-size:14.5px}.sbar .t small{display:block;color:var(--sub);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sbar .hb{font-size:12.5px;padding:5px 9px}
.stasks{display:flex;gap:6px;overflow-x:auto;padding:6px 1px 0;scrollbar-width:none}
.stk{flex:none;font-size:12.5px;padding:4px 10px;border-radius:12px;background:var(--card);border:1px solid var(--line);color:var(--sub);white-space:nowrap}
.stk.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.stk.cur{border-color:var(--pri);color:var(--pri);font-weight:600}
.msg.ai .who{font-size:12px;color:var(--sub);margin:0 0 3px 6px}
.coach{display:flex;align-items:center;gap:8px;border-left:3px solid var(--ok);max-width:92%}
.coach .tag{background:#e6f6ee;color:var(--ok);flex:none}
.coach .en{flex:1;font-size:15px}
.debrief{text-align:center;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 12px;margin:14px 0}
.dstars{font-size:30px;color:var(--warn);letter-spacing:4px;margin-bottom:4px}
@media (prefers-color-scheme:dark){.coach .tag{background:#173a2a}.stage{background:#1d2133}}
.w.lk{text-decoration:underline;text-decoration-color:var(--lkc);text-decoration-thickness:2px;text-underline-offset:3px}
.lkm{color:var(--lkc);font-weight:700;cursor:pointer;padding:0 1px;margin:0 -1px;display:inline-block;transform:translateY(3px)}
.lkph{color:var(--lkc);font-weight:700}
.tools .lkbtn{background:#fff1e8;color:var(--lkc)}
@media (prefers-color-scheme:dark){.tools .lkbtn{background:#3b2414}}
#ccap .w.lk{text-decoration-color:#ffb380}
#ccap .lkm{color:#ffb380}
#vsearch{width:100%;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px;outline:none;margin:2px 0 8px;font-size:16px}
.vrow{padding:7px 10px;margin-bottom:5px;gap:6px}.vrow .ib{width:30px;height:30px}.vrow .t b{display:inline;font-size:16px}.vrow .t span{margin-left:6px;font-size:14px}.vrow .t small{display:block;margin-top:1px}
.bar{height:8px;border-radius:4px;background:var(--pri2);margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok);border-radius:4px}
.sn{border-radius:6px;transition:background .15s}
.say .sn{color:inherit;font-size:inherit}
.sn.on{background:var(--pri2)}
.sp{display:inline-flex;width:20px;height:20px;border-radius:50%;background:var(--pri2);color:var(--pri);align-items:center;justify-content:center;vertical-align:1px;margin-right:4px}
.sp svg{width:9px;height:9px;fill:currentColor}
.w{font-style:normal;border-radius:4px;cursor:pointer}
.w:active{background:var(--pri2)}
#ccap .sp{background:rgba(255,255,255,.22);color:#fff}
#ccap .sn.on{background:rgba(255,255,255,.18)}
#ccap .w:active{background:rgba(255,255,255,.25)}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:10px;background:var(--pri2);color:var(--pri);font-weight:600}
.lvh{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.lvh b{color:var(--ink);font-size:15px}
.lvh em{margin-left:auto;font-style:normal;color:var(--pri);font-weight:600}
.scene.done{border-color:var(--ok)}
.scene.done b{color:var(--ok)}
.scene.nx{border-color:var(--pri);box-shadow:0 0 0 1px var(--pri) inset}
.stars{color:var(--warn);letter-spacing:1px;font-size:14px}
.note-msg button{margin-left:6px}
</style>
</head>
<body>
<div id="app">
  <header><h1 id="title">口语陪练</h1><span id="hbtns"></span></header>
  <main id="main">
    <section class="view on" id="chatv"></section>

/* ---------- AI 接口 ---------- */
const P=()=>PROV[S.cfg.prov];
const ALI_ROOTS=['https://maas.qianwenaiapi.com','https://dashscope.aliyuncs.com'];
const aliRoot=()=>S.cfg.aliRoot||ALI_ROOTS[0];

/* 新的千问平台密钥和老的百炼密钥走不同域名：哪个认这个密钥就用哪个 */
async function detectAli(){
 const k=aliKey();if(!k)return;
 const res=[];
 for(const root of ALI_ROOTS){
  try{const r=await fetchR(root+'/compatible-mode/v1/models',{headers:{authorization:'Bearer '+k}});if(r.ok){if(S.cfg.aliRoot!==root){S.cfg.aliRoot=root;save()}return root}res.push(r.status)}
  catch(e){res.push('net')}
 }
 const info=`（已填 ${k.length} 位，开头 ${k.slice(0,3)}）`;
 if(res.every(x=>x==='net'))throw new Error('手机连不上阿里云服务器：请检查网络，或让加速器对国内网站直连'+info);
 if(res.some(x=>x===401||x===403))throw new Error('阿里云拒绝了这个密钥：多半是粘贴的内容不对，请重新复制粘贴'+info);
 throw new Error('阿里云接口出错 '+res.join('/')+info);
}
/* 粘贴的密钥：去掉空白、引号和不可见字符；夹在别的文字里也能取出来 */
function cleanKey(v){v=String(v||'').replace(/[\s\u200b-\u200d\ufeff"'“”‘’]/g,'');const m=v.match(/sk-[A-Za-z0-9_\-]{8,}/);return m?m[0]:v}
const keyInfo=k=>k?`<small style="display:block;color:var(--sub);font-size:12px;text-align:right">已填 ${k.length} 位 · 开头 ${esc(k.slice(0,3))}</small>`:'';
const apiKey=()=>(S.cfg.keys[S.cfg.prov]||'').trim();
const oaiKey=()=>(S.cfg.prov==='openai'?apiKey():'')||(S.cfg.oaiKey||'').trim();
const aliKey=()=>(S.cfg.prov==='qwen'?apiKey():'')||(S.cfg.aliKey||'').trim();
const ENG_NAME={ali:'阿里云',openai:'OpenAI',system:'手机自带'};
class NeedKey extends Error{}
/* 网络抖动（连接被重置）时立刻再试一次；服务端返回的错误不重试 */
async function fetchR(url,opt){
 try{return await fetch(url,opt)}
 catch(e){if(e.name==='AbortError'||(opt&&opt.signal&&opt.signal.aborted))throw e;return fetch(url,opt)}
}

function authHeaders(){
 const k=apiKey();
 if(P().type==='anthropic')return {'content-type':'application/json','x-api-key':k,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'};
 return {'content-type':'application/json','authorization':'Bearer '+k};
}
async function apiErr(r,chat){
 let m='';try{const t=await r.text();try{const j=JSON.parse(t);m=(j.error&&(j.error.message||j.error))||j.message||t}catch(e){m=t}}catch(e){}
 m=String(m).slice(0,200);
 const map={401:'密钥不对或已失效',402:'账户余额不足，请先充值',403:'没有权限（密钥或地区限制）',404:'接口地址或模型名不对',429:'请求太频繁或额度用完，稍等再试'};
 if(chat&&(r.status===404||/model/i.test(m)&&r.status===400)){S.cfg.model[S.cfg.prov]='';save()}
 return new Error((map[r.status]||('服务出错 '+r.status))+(m?'：'+m:''));
}
async function listModels(){
 const r=await fetch(base()+'/models',{headers:authHeaders()});
 if(!r.ok)throw await apiErr(r,true);
 const j=await r.json();return (j.data||[]).map(x=>x.id).filter(Boolean);
}
async function ensureModel(){
 const cur=(S.cfg.model[S.cfg.prov]||'').trim();if(cur)return cur;
 let m=P().fallback;
 try{const ids=(await listModels()).filter(i=>!/audio|realtime|tts|asr|omni|transcribe|search|image|embed|reasoner|vl|ocr|math|coder|-mt|-\d{4}-\d\d-\d\d$/i.test(i)).sort().reverse();
  for(const re of P().pick){const f=ids.find(i=>re.test(i));if(f){m=f;break}}
  if(!m&&ids.length)m=ids[0];
 }catch(e){if(!m)throw e}
 if(!m)throw new Error('请在“我的 → AI 服务”里填写模型名');
 S.cfg.model[S.cfg.prov]=m;save();return m;
}
function fixRoles(msgs){
 const out=[];
 for(const m of msgs){if(!m.content)continue;const l=out[out.length-1];if(l&&l.role===m.role)l.content+='\n'+m.content;else out.push({role:m.role,content:m.content})}
 if(out.length&&out[0].role!=='user')out.unshift({role:'user',content:'(Start the conversation.)'});
 return out;
}
async function* streamAI(system,msgs,signal){
 if(!apiKey())throw new NeedKey('还没有填 AI 密钥');
 if(!base())throw new Error('请先填写接口地址');
 const model=await ensureModel();msgs=fixRoles(msgs);
 const anth=P().type==='anthropic';
 const body=anth?{model,max_tokens:1000,system,messages:msgs,stream:true}:{model,messages:[{role:'system',content:system},...msgs],stream:true,max_tokens:700};
 if(S.cfg.prov==='qwen')body.enable_thinking=false;
 const r=await fetchR(base()+(anth?'/messages':'/chat/completions'),{method:'POST',headers:authHeaders(),body:JSON.stringify(body),signal});
 if(!r.ok)throw await apiErr(r,true);
 const rd=r.body.getReader(),dec=new TextDecoder();let buf='';
 for(;;){
  const {done,value}=await rd.read();if(done)break;
  buf+=dec.decode(value,{stream:true});let i;
  while((i=buf.indexOf('\n'))>=0){
   const line=buf.slice(0,i).trim();buf=buf.slice(i+1);
   if(!line.startsWith('data:'))continue;const d=line.slice(5).trim();if(d==='[DONE]')return;
   let j;try{j=JSON.parse(d)}catch(e){continue}
   if(anth){if(j.type==='content_block_delta'&&j.delta&&j.delta.text)yield j.delta.text;if(j.type==='error')throw new Error(j.error&&j.error.message||'服务出错')}
   else{const c=j.choices&&j.choices[0]&&j.choices[0].delta&&j.choices[0].delta.content;if(c)yield c}
  }
 }
}
async function askAI(system,user,onText,signal){let t='';for await(const c of streamAI(system,[{role:'user',content:user}],signal)){t+=c;onText&&onText(t)}return t}

/* ---------- 提示词 ---------- */
function corePrompt(levelP,scene){
 return `You are Sam, a warm, patient, upbeat American from California. You are the English speaking partner of a Chinese university student. Their spoken English is still limited: they speak slowly, in fragments, with fillers (um, uh), repeated words, wrong tenses, Chinese word order, and sometimes switch to Chinese in the middle of a sentence. Your job is to make them feel understood, keep them talking, and help them say it better. ${levelP} Keep your own English simple, clear and friendly.
${scene}

Every response MUST use exactly this plain-text format, one item per line, nothing else:
REPLY: <what you say out loud in natural spoken American English, 2-4 short sentences>
ZH: <natural Chinese translation of REPLY>
MEAN: <用一句中文、以“你想说”开头，写出你理解的对方这句话的意思>
BETTER: <the learner's whole latest message, rewritten as a native American would naturally say it, keeping their meaning>
FIX: <the learner's wrong or unnatural words> => <the natural way to say it> || <一句简短的中文说明>
SAY: <useful English expression> || <中文意思> || <简短中文用法提示，可省略>

How to help this learner:
- Always work out what they are trying to say, even from broken English, mixed Chinese, fillers or speech-recognition mistakes. Never say you don't understand unless it is truly impossible; make your best guess.
- CORRECT OUT LOUD. This is the most important rule. If the learner's latest message (in English) has any real grammar or word-choice mistake, your REPLY must correct it out loud, every single time, before moving on: after your short reaction, say the corrected sentence and a very short reason, in a friendly way. For example: "Quick tip: we say 'I went to the library yesterday', because it already happened." or "Small fix: it's 'there are so many kinds of food'." Correct only the single most important mistake out loud (the rest go in FIX lines). Never just guess their meaning and continue as if nothing was wrong. Natural, common American phrasings are NOT mistakes (e.g. "Can I get...", "Yeah", "Gonna"); never "correct" them.${S.cfg.sayFix===false?' (The learner turned off spoken corrections: do NOT correct out loud in REPLY; put corrections only in FIX lines.)':''}
- If their message was broken or hard to follow, also briefly check your understanding in natural English (e.g. "Oh, you mean you love all kinds of food, like fruit, veggies and beef?"), so they hear the correct way to say it.
- After correcting, respond to what they said and ask one simple follow-up question.
- If they get stuck or say they can't explain something, reassure them and tell them they can say that part in Chinese; then teach them the English for it.
- MEAN: always include it when the latest message is from the learner.
- BETTER: include it whenever their English had any mistake or sounded unnatural; skip it if it was already natural or written in Chinese.
- FIX: 0-3 lines for the most useful corrections only (grammar, word choice, unnatural phrasing). Never correct Chinese. Ignore punctuation, capitalization, fillers and repeated words: the input is speech recognition.
- SAY: 0-3 genuinely useful expressions.
- If they write in Chinese or ask how to say something ("…怎么说", "用英语", "how do I say"): in REPLY give the most natural way an American would say it (You could say: "..."), then invite them to try saying it. Put 2-3 alternatives in SAY (casual / neutral / formal) with Chinese meaning and when to use each.
- If they ask any question (English, facts, advice, anything), answer helpfully and briefly in simple spoken English, then keep the conversation going.
- Start REPLY with a short natural reaction of 2-6 words that ends with punctuation (e.g. "Oh nice!", "Got it.", "Ha, that's funny."), then continue.
- REPLY is read aloud: plain words only (single quotes around a corrected sentence are fine). No emojis, no asterisks or other markdown, no lists, no brackets, no stage directions.`;
}

async function runAI(s,hiddenUser){
 busy=true;ctrl=new AbortController();
 if(hiddenUser)s.msgs.push({role:'user',text:hiddenUser,hidden:true});
 const m={role:'ai',text:'',t:Date.now(),live:true};s.msgs.push(m);renderChat(true);
 const hist=s.msgs.filter(x=>x!==m&&x.role!=='err'&&x.role!=='note').slice(-24).map(x=>({role:x.role==='ai'?'assistant':'user',content:x.text}));
 const SYS=sysPrompt(s),needStep=/STEP: </.test(SYS)||/Also output this line: STEP/.test(SYS),lesson=isLesson(s),zeroLv=lesson&&SCENE_BY[s.scene].lv===0;
 const tags=['REPLY','ZH','MEAN','BETTER','FIX'].concat(lesson?['COACH']:[],['SAY'],needStep?['STEP']:[]);
 if(hist.length&&hist[hist.length-1].role==='user')hist[hist.length-1]={role:'user',content:hist[hist.length-1].content+'\n\n(Answer in the '+tags.join(' / ')+' line format.'+(needStep?' Always include the STEP line, also on your last turn.':'')+(lesson?' Stay in character in REPLY.':'')+(zeroLv?' Always include COACH with You can say: "...".':'')+' No emojis or markdown.)'};
 const vp=sceneVoices(s);
 let raw='',sp=null,fed=0,fin=false;const want=S.cfg.autoplay||CALL;callState('think');
 /* 回复一写完一句就交给发音，不等整段 */
 const feed=(reply,final)=>{
  if(!want||fin||!reply)return;
  const cut=final?reply.length:lastBound(reply,fed);
  if(cut>fed){if(!sp){sp=newSpeech(false,vp.main);if(CALL)callState('speak')}sp.push(reply.slice(fed,cut));fed=cut}
  if(final)fin=true;
 };
 try{
  for await(const c of streamAI(SYS,hist,ctrl.signal)){
   raw+=c;const o=parseOut(raw);m.text=o.reply;updLive(m);feed(o.reply,replyDone(raw));
  }
  const o=parseOut(raw);
  /* 说话识别出来的文字没有标点：只差标点、大小写、连字符的“纠错”直接丢掉；没有真错误时教练不出声 */
  {const nz=x=>String(x||'').toLowerCase().replace(/[^a-z0-9]/g,''),lu=[...s.msgs].reverse().find(x=>x.role==='user'&&!x.hidden);
   o.fix=o.fix.filter(f=>nz(f.from)!==nz(f.to));
   if(o.better&&lu&&nz(o.better)===nz(lu.text))o.better='';
   if(lesson&&!zeroLv&&!o.fix.length&&!o.better)o.coach='';}
  Object.assign(m,{text:o.reply||raw.trim(),zh:o.zh,say:o.say});if(o.coach)m.coach=o.coach;delete m.live;
  {const u=[...s.msgs].reverse().find(x=>x.role==='user'&&!x.hidden&&x!==m);
   if(u&&!u.hidden&&s.msgs.indexOf(u)===s.msgs.indexOf(m)-1){if(o.fix.length)u.fix=o.fix;if(o.mean)u.mean=o.mean;if(o.better&&o.better.toLowerCase()!==u.text.trim().toLowerCase()&&!hasZh(o.better))u.better=o.better}}
  if(o.step)handleStep(s,o.step);
  save();busy=false;renderChat(true);
  feed(m.text,true);
  if(want&&m.coach&&(zeroLv||S.cfg.sayFix!==false)){if(!sp)sp=newSpeech(false,vp.main);sp.push(m.coach,vp.coach)}
  if(sp)sp.end();
  if(CALL){callCap(m);if(sp)await sp.done;if(!CALL)return;if(S.cfg.autoListen)callNext();else{const n=lkOn()?lkList(m.text).length:0;callState('idle',n?`这句有 ${n} 处连读（橙色），点“连读”跟读；想回答时点圆圈`:'轮到你了：可以先跟读，想回答时点圆圈')}}
 }catch(e){
  busy=false;s.msgs.splice(s.msgs.indexOf(m),1);
  if(e.name!=='AbortError'){s.msgs.push({role:'err',text:e.message||String(e)});if(e instanceof NeedKey)setTimeout(()=>{go('mev');toast('先在这里填好 AI 密钥')},600)}
  save();renderChat(true);if(CALL&&e.name!=='AbortError'){callState('idle','出错了：'+(e.message||e).slice(0,60))}
 }
}

/* 跟读打分 */
const CONTR={"i'm":"i am","you're":"you are","we're":"we are","they're":"they are","he's":"he is","she's":"she is","it's":"it is","that's":"that is","what's":"what is","where's":"where is","there's":"there is","here's":"here is","let's":"let us","i've":"i have","you've":"you have","we've":"we have","they've":"they have","i'll":"i will","you'll":"you will","we'll":"we will","it'll":"it will","i'd":"i would","you'd":"you would","don't":"do not","doesn't":"does not","didn't":"did not","can't":"can not","cannot":"can not","won't":"will not","isn't":"is not","aren't":"are not","wasn't":"was not","weren't":"were not","haven't":"have not","hasn't":"has not","couldn't":"could not","wouldn't":"would not","shouldn't":"should not","gonna":"going to","wanna":"want to","gotta":"got to","ok":"okay"};
const NUMW=['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen','twenty'];
const words=s=>clean(s).toLowerCase().replace(/[’‘]/g,"'").replace(/[^a-z0-9' ]+/g,' ').split(' ').flatMap(w=>{w=w.replace(/^'+|'+$/g,'');if(!w)return [];if(CONTR[w])return CONTR[w].split(' ');if(/^\d+$/.test(w)&&+w<=20)return [NUMW[+w]];return [w]});
function compare(target,said){
 const a=words(target),b=words(said),n=a.length,m=b.length;
 const dp=Array.from({length:n+1},()=>new Array(m+1).fill(0));
 for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)dp[i][j]=a[i]===b[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
 const ok=new Array(n).fill(false);let i=0,j=0;
 while(i<n&&j<m){if(a[i]===b[j]){ok[i]=true;i++;j++}else if(dp[i+1][j]>=dp[i][j+1])i++;else j++}
 const hit=ok.filter(Boolean).length;
 const score=n?Math.round(100*hit/Math.max(n,(n+m)/2)):0;
 const toks=clean(target).split(' ');let k=0;
 const html=toks.map(t=>{const w=words(t);if(!w.length)return esc(t);let good=true;for(let q=0;q<w.length;q++)if(!ok[k++])good=false;return `<span class="${good?'w-ok':'w-miss'}">${esc(t)}</span>`}).join(' ');
 return {score,html};
}

}

function openerFor(s,call){
 const id=s.scene||'free';
 if(id.startsWith('g:'))return '(Start the grammar practice: greet me in one short sentence, then ask your first question.)';
 if(id.startsWith('v:'))return '(Start the vocabulary practice: set the scene in one short sentence, then ask your first question.)';

function handleStep(s,step){

 if(n>=t&&!s.passed){
  s.passed=true;
  const kind=s.scene.startsWith('g:')?'gdone':s.scene.startsWith('v:')?'vdone':'done';
  if(kind==='done'){
   S.done=S.done||{};S.done[s.scene]=Date.now();
   const sc=SCENE_BY[s.scene],us=s.msgs.filter(x=>x.role==='user'&&!x.hidden),mist=us.filter(x=>x.fix&&x.fix.length).length,stars=mist<=1?3:mist<=3?2:1;
   if(sc&&sc.tasks){S.sstars=S.sstars||{};S.sstars[s.scene]=Math.max(S.sstars[s.scene]||0,stars);
    s.msgs.push({role:'note',kind,stars,turns:us.length,mist,tw:sc.tw?sc.tw[(s.twist|0)%sc.tw.length][0]:'',text:'通关：'+sc.t,t:Date.now()})}
   else s.msgs.push({role:'note',kind,text:'这个场景完成了！你做到了。',t:Date.now()});

 return corePrompt(levelP,scene);

/* ---------- 连读：自动找出句子里的连读 ---------- */
const LKN={cv:'辅音连元音',vy:'元音连读（滑出 y）',vw:'元音连读（滑出 w）',same:'相同辅音只读一次',ty:'t / d + you 变音',flap:'美式 t 弹舌',drop:'t / d 吞音',h:'h 不发音',reduce:'口语缩读'};
const LK_WHY={
 cv:'前一个词以辅音结尾、后一个词以元音开头，辅音直接“搬”到后面，两个词听起来像一个词。',
 vy:'前一个词以 i、ee、ay、y 这类咧嘴的元音结尾，后面又是元音，中间自然滑出一个很轻的 y。',
 vw:'前一个词以 o、oo、ow、u 这类圆嘴的元音结尾，后面又是元音，中间自然滑出一个很轻的 w。',
 same:'前一个词结尾和后一个词开头是同一个辅音，只发一次，稍微拉长一点。',
 ty:'t 后面接 you 常变成 ch，d 后面接 you 常变成 j。',
 flap:'美式英语里，t 夹在两个元音之间（包括跨两个词），读成很轻很快的 d，舌尖一弹就过去。',
 drop:'t 或 d 夹在两个辅音之间时几乎不发音，只是轻轻停一下。',
 h:'him、her、his、have、has、had、them 在句子中间弱读时，开头的 h（或 th）常常不发，再和前一个词连起来。',
 reduce:'口语里一些固定组合会被压缩成一个词，美国人日常说话几乎都这么说。'};
const LK_RED=[
 [['going','to'],'gonna'],[['want','to'],'wanna'],[['wants','to'],'wantsta'],[['got','to'],'gotta'],[['have','to'],'hafta'],[['has','to'],'hasta'],[['kind','of'],'kinda'],[['sort','of'],'sorta'],[['out','of'],'outta'],[['lot','of'],'lotta'],[['let','me'],'lemme'],[['give','me'],'gimme'],[["don't",'know'],'dunno'],
 [['what','are','you'],'whatcha'],[['what','do','you'],'whaddaya'],[['did','you'],'didja'],[['would','you'],'wouldja'],[['could','you'],'couldja'],[['should','you'],'shouldja'],[["don't",'you'],'donchu'],[['got','you'],'gotcha'],[['bet','you'],'betcha'],[['need','to'],'needa'],[['used','to'],'useta'],[['supposed','to'],'supposta'],[['ought','to'],'oughta'],[['a','lot','of'],'a lotta']];
const LK_NOGONNA=new Set(['the','a','an','my','your','his','her','our','their','this','that','school','work','bed','church','class','town','sleep']);
const lkW=w=>w.toLowerCase().replace(/[’]/g,"'").replace(/[^a-z']/g,'');
function lkStartsV(w){
 if(/^(hour|honest|honor|heir)/.test(w))return true;
 if(/^(one|once|eu|ewe)/.test(w))return false;
 if(/^u/.test(w))return !/^(uni|use|usu|uti|ute|ura|uri|uro|uku)/.test(w);
 return /^[aeio]/.test(w);
}
function lkEnd(w){/* 返回 C=辅音 y/w=元音并滑出 y/w 0=元音不滑 */
 if(!w)return null;
 if(/(ee|ey|ay|oy|uy|y|i)$/.test(w))return 'y';
 if(/(ow|ew|ue|oo|ou|o|u)$/.test(w))return 'w';
 if(/e$/.test(w))return /^(the|be|he|she|we|me)$/.test(w)?'y':'C';
 if(/gh$/.test(w))return null;
 if(/a$/.test(w))return '0';
 if(/h$/.test(w))return /(sh|ch|th|ph)$/.test(w)?'C':'0';
 return /[bcdfgjklmnpqrstvxz']$/.test(w)?'C':null;
}
function lkPair(a,b){
 const A=lkW(a),B=lkW(b);if(!A||!B)return null;
 const ca=a.replace(/[^A-Za-z']/g,''),cb=b.replace(/[^A-Za-z']/g,'').replace(/'/g,'');
 const pa=ca.replace(/n't$/,'nt').replace(/'/g,'');            /* 提示里用的写法：保留大小写、去掉撇号 */
 const cut=(x)=>/[^aeiouAEIOU]e$/.test(x)&&x.length>2?x.slice(0,-1):x;   /* 去掉不发音的 e */
 const move=(x,y)=>{const base=cut(x),ck=/ck$/i.test(base);return base.slice(0,base.length-(ck?2:1))+'-'+(ck?'k':base.slice(-1).toLowerCase())+y};
 if(/[td]$/.test(A.replace(/'$/,''))&&/^(you|your|you're|yourself|you'll|you've|you'd)$/.test(B)){
  const d=/d$/.test(A);return {k:'ty',h:pa.replace(/[td]$/,'')+'-'+(d?'ju':'chu')+cb.slice(3).toLowerCase()};
 }
 if(/^(him|her|his|have|has|had|them)$/.test(B)&&lkEnd(A)==='C')return {k:'h',h:move(pa,B==='them'?'em':B.slice(1))};
 const e=lkEnd(A),v=lkStartsV(B);
 if(e==='C'&&v&&/([aeiouy]|r)t$/.test(A))return {k:'flap',h:pa.slice(0,-1)+'-d'+cb.toLowerCase()};
 if(e==='C'&&v)return {k:'cv',h:move(pa,cb.toLowerCase())};
 if((e==='y'||e==='w')&&v)return {k:e==='y'?'vy':'vw',h:pa+' ('+e+') '+cb.toLowerCase()};
 if(e==='C'){const la=cut(A).slice(-1),fb=B[0];
  if(la===fb&&!/[aeiouyhw']/.test(la))return {k:'same',h:cut(pa).slice(0,-1)+'-'+cb.toLowerCase()};
  if(/([^aeiou][td]|n't)$/.test(A)&&!/[aeiouyhw]/.test(fb))return {k:'drop',h:pa.replace(/[td]$/,'')+' '+cb.toLowerCase()};
 }
 return null;
}
/* 把一句话拆成词，标出连读：返回 [{w,trail,link}]，link 连着下一个词 */
function lkAnalyze(s){
 const toks=String(s).trim().split(/\s+/).filter(Boolean);
 const W=toks.map(t=>{const m=t.match(/^(.*?)([,.!?;:"”)\]…—]*)$/);return {w:m[1],trail:m[2],link:null}});
 for(let i=0;i<W.length;i++){
  if(W[i].link)continue;
  let hit=null;
  for(const [seq,red] of LK_RED){
   if(i+seq.length>W.length)continue;
   let ok=true;for(let j=0;j<seq.length;j++){if(lkW(W[i+j].w)!==seq[j]||(j<seq.length-1&&W[i+j].trail)){ok=false;break}}
   if(!ok)continue;
   if(seq[0]==='going'){const nx=W[i+2];if(!nx||LK_NOGONNA.has(lkW(nx.w)))continue}
   hit={seq,red};break;
  }
  if(hit){const ph=W.slice(i,i+hit.seq.length).map(x=>x.w).join(' ');for(let j=0;j<hit.seq.length-1;j++)W[i+j].link={k:'reduce',h:hit.red,ph};i+=hit.seq.length-2;continue}
  if(i<W.length-1&&!W[i].trail){const p=lkPair(W[i].w,W[i+1].w);if(p)W[i].link={...p,ph:W[i].w+' '+W[i+1].w}}
 }
 return W;
}

const lkOn=()=>S.cfg.lkOn!==false;
function wrapWords(s){
 if(!lkOn())return s.split(/(\s+)/).map(tok=>{const m=tok.match(/^([^A-Za-z0-9]*)([A-Za-z0-9](?:[A-Za-z0-9'’\-]*[A-Za-z0-9])?)([^A-Za-z0-9]*)$/);return m?`${esc(m[1])}<i class="w">${esc(m[2])}</i>${esc(m[3])}`:esc(tok)}).join('');
 const W=lkAnalyze(s);let out='',prevLinked=false;
 W.forEach((x,i)=>{
  const m=x.w.match(/^([^A-Za-z0-9]*)([A-Za-z0-9](?:[A-Za-z0-9'’\-]*[A-Za-z0-9])?)?(.*)$/)||['',x.w,'',''];
  const linked=!!x.link||prevLinked;
  out+=esc(m[1])+(m[2]?`<i class="w${linked?' lk':''}">${esc(m[2])}</i>`:'')+esc(m[3])+esc(x.trail);
  if(x.link)out+=`<b class="lkm" data-a="lk" data-k="${x.link.k}" data-h="${esc(x.link.h)}" data-ph="${esc(x.link.ph)}" aria-label="连读">‿</b>`;
  else if(i<W.length-1)out+=' ';
  prevLinked=!!x.link;
 });
 return out;
}
function lkList(text){const out=[],seen=new Set();for(const s of sentences(text))for(const x of lkAnalyze(s))if(x.link&&!seen.has(x.link.ph+'|'+x.link.k)){seen.add(x.link.ph+'|'+x.link.k);out.push({...x.link,s})}return out}

 }
 sheet(sheetHead(`${esc(VQ.c.zh)} · ${VQ.i+1}/${VQ.items.length}`)+`<div class="card" style="text-align:center;padding:18px 10px"><div style="font-size:24px;font-weight:700">${esc(it[1])}</div>${it[2]?`<div class="note">${esc(it[2])}</div>`:''}<div class="words" id="sw" style="filter:blur(7px)">${esc(it[0])}</div></div>

const vnorm=x=>String(x||'').toLowerCase().replace(/\(.*?\)/g,'').replace(/^(a|an|the|to)\s+/,'').replace(/[^a-z0-9 ]/g,'').replace(/\s+/g,' ').trim();
function vqCheck(){
 const it=VQ.items[VQ.i],ans=($('#vans').value||'').trim();
 const alts=it[0].split(/\s*\/\s*|\s*,\s*/).map(vnorm),a=vnorm(ans);
 const ok=!!a&&(alts.includes(a)||alts.some(x=>x.length>3&&(a.includes(x)||x.includes(a)&&a.length>=x.length-2))||compare(it[0],ans).score>=80);
 if(ok)VQ.ok++;else{VQ.miss.push(it);if(!inBook(it[0]))addBook({en:it[0],zh:it[1],note:it[2]||''},true)}
 $('#sw').style.filter='';speak(it[0]);
 $('#sres').innerHTML=ok?'<b style="color:var(--ok)">答对了 ✓</b>':`<b style="color:var(--bad)">正确答案在上面</b>${ans?`<div>你说的：${esc(ans)}</div>`:''}`;
 $('#vqb').innerHTML=`<button class="btn" data-a="vqnext">${VQ.i+1<VQ.items.length?'下一个':'看结果'}</button>`;
}

 const lv=SCENE_LV[sc.lv],tw=sc.tw&&sc.tw[(sess.twist|0)%sc.tw.length],zero=sc.lv===0,fixOn=S.cfg.sayFix!==false;
 const facts=sc.prop?`${sc.prop.title}: ${sc.prop.rows.map(r=>r[0]+' '+r[1]).join('; ')}${sc.prop.note?'. '+sc.prop.note:''}`:'';
 const coachRule=zero?'ALWAYS include this line: a short whisper from a coach standing next to the learner, giving a ready-made answer for their next line, in the form: You can say: "...". Keep it under 8 words and use ___ for personal facts like names.'
  :fixOn?'Include this line ONLY when the learner\'s latest message had a real grammar or word-choice mistake, or when they seem stuck: one short, friendly tip in simple English from a coach standing next to them, e.g. Quick tip: say "a large latte", not "large latte". If there was no real mistake, leave the COACH line out completely: no praise, no "good job", no alternative phrasings.'
  :'Include this line only when the learner seems stuck: one short hint in simple English from a coach standing next to them. Otherwise leave the line out.';
 return `This is an immersive English role-play for an adult learner whose spoken English is still limited. ${lv.p}
YOU PLAY: ${sc.ch.n}, ${sc.ch.rEn}. Personality: ${sc.ch.vEn}. Stay completely in character the whole time. Talk exactly like a real ${sc.ch.rEn} in the US would: natural, everyday spoken American English with the little reactions and small talk real people use, but keep each turn short (1-3 sentences) and easy enough for this learner.
SETTING: ${sc.sceneEn}
${facts?'FACTS (stay consistent with them and use the real prices and details): '+facts+'\n':''}THE LEARNER PLAYS: ${sc.youEn}.
${tw?(sc.twNow?'TODAY\'S TOPIC (use it from your first line): ':'TODAY\'S TWIST (bring it up naturally at a good moment, not in your first line): ')+tw[1]+'\n':''}TASKS the learner must complete, in order:
${sc.tasks.map((x,i)=>(i+1)+') '+x[1]).join('\n')}
HOW TO RUN THE SCENE:
- Lead the interaction the way the real ${sc.ch.rEn} would, so the learner naturally does each task in order. React to what they actually say, like a real person.
- Inside REPLY never mention tasks, lessons, practice, grammar or English, and never say you are an AI or a teacher.
- If the learner goes off-topic, react briefly the way a real person would and steer back to the situation.
- If the learner makes a language mistake, do NOT break character in REPLY. You may naturally echo the correct form, the way people do ("A medium? Sure thing."). The teaching goes in the COACH and FIX lines.
- When every task is done, wrap up naturally the way the real person would (for example "Here you go. Have a great day!").

Every response MUST use exactly this plain-text format, one item per line, nothing else:
REPLY: <what ${sc.ch.n} says out loud>
ZH: <natural Chinese translation of REPLY>
MEAN: <用一句中文、以“你想说”开头，写出你理解的对方这句话的意思>
BETTER: <the learner's whole latest message, said the way a native speaker would say it in this situation; leave out if it was already natural or written in Chinese>
FIX: <the learner's wrong or unnatural words> => <the natural way> || <一句简短的中文说明>   (0-3 lines, real mistakes only; ignore punctuation, fillers and speech-recognition noise; never correct Chinese)
   IMPORTANT: missing information or a task the learner has not done yet is NOT a language mistake. Common, natural American phrasings are NOT mistakes and must never be "corrected" in FIX or COACH (for example "Can I get...", "I'll have...", "Yeah", "Two, please", "Just the two of us" are all perfectly natural).
COACH: <${coachRule}>
SAY: <a useful expression for this situation> || <中文意思> || <简短中文用法提示，可省略>   (0-2 lines)
STEP: <number of tasks the learner has completed so far>/${sc.tasks.length}
REPLY is read aloud: plain words only, no emojis, asterisks, brackets or stage directions.`;
}

 if(v==='chatv')renderChat(true);if(v==='scenev')renderScenes();if(v==='gramv')renderGram();if(v==='vocv')renderVoc();if(v==='lkv')renderLk();if(v==='bookv')renderBook();if(v==='mev')renderMe();
 renderBar2();if(v!=='chatv')$('#main').scrollTop=0;
}
$('#nav').onclick=e=>{const b=e.target.closest('button');if(!b)return;const v=b.dataset.v,on=$('#'+v).classList.contains('on');if(on){if(v==='gramv')gramCur=null;if(v==='vocv')vocCur=null;if(v==='lkv')lkCur=null}go(v)};

document.body.addEventListener('click',async e=>{
 const wd=e.target.closest('.w');
 if(wd&&!wd.closest('.blur')&&!wd.closest('.hidecap')){const sn=wd.closest('.sn');e.preventDefault();return lookupWord(wd.textContent,sn?sn.textContent.trim():wd.textContent)}
 const t=e.target.closest('[data-a],[data-chip],[data-scene]');if(!t)return;
 if(t.dataset.chip){txt.value=t.dataset.chip;sendText(t.dataset.chip);return}
 if(t.dataset.scene)return sceneIntro(t.dataset.scene);
 const a=t.dataset.a,msgEl=t.closest('.msg'),s=curSess();
 const m=msgEl&&s?s.msgs[+msgEl.dataset.i]:null;
 const card=t.closest('[data-en]');
 switch(a){
  case 'close':return closeSheet();
  case 'lk':return lkPopup(t);
  case 'lkall':return lkAll(m.text);
  case 'lkgo':closeSheet();lkCur=t.dataset.id;if(CALL)exitCall();go('lkv');$('#main').scrollTop=0;return;
  case 'lkgen':return lkGen(t.dataset.id);
  case 'pslow':return speak(t.dataset.en,true);
  case 'shp':return openShadow(t.dataset.en,'');
  case 'back':{const v=t.dataset.v;if(v==='vocv')vocCur=null;if(v==='lkv')lkCur=null;go(v==='bookv'?'vocv':v);$('#main').scrollTop=0;return}
  case 'tobook':go('bookv');return;
  case 'vopen':vocCur=t.dataset.id;go('vocv');$('#main').scrollTop=0;return;
  case 'vquiz':return vocQuiz(t.dataset.id);
  case 'vqsub':return vqCheck();
  case 'vqmic':return vqMic();
  case 'vqnext':VQ.i++;return vqItem();
  case 'vchat':return vocChat(t.dataset.id,false);
  case 'vcall':return vocChat(t.dataset.id,true);
  case 'vagain':{const id=(s.scene||'').slice(2);if(!VOC)await loadVocab();return vocChat(id,false)}
  case 'goal':S.cfg.goal=+t.dataset.m;save();return renderMe();
  case 'psn':{document.querySelectorAll('.sn.on').forEach(x=>x.classList.remove('on'));const sn=t.closest('.sn');if(sn)sn.classList.add('on');if(CALL&&REC)REC.abort();const vv=sceneVoices(curSess()),inAI=t.closest('.msg.ai')||t.closest('#ccap');return speak(t.dataset.s,false,inAI?(t.closest('.coach')?vv.coach:vv.main):null).then(()=>sn&&sn.classList.remove('on'))}
  case 'pw':return speak(t.dataset.en);
  case 'wfav':{const on=addBook({en:t.dataset.en,zh:t.dataset.zh,note:t.dataset.note});t.textContent=on?'已在表达本':'收藏这个词';t.classList.toggle('g',!!on);return}
  case 'sintro':return sceneIntro(t.dataset.id);
  case 'sgo':return startLesson(t.dataset.id,false);
  case 'scall':return startLesson(t.dataset.id,true);
  case 'custcall':{const v=($('#cust').value||'').trim();if(!v)return toast('写一句场景描述');return startLesson('custom',true,v)}
  case 'nextscene':return sceneIntro(nextScene().id);
  case 'gopen':gramCur=t.dataset.id;go('gramv');$('#main').scrollTop=0;return;
  case 'gback':gramCur=null;return go('gramv');
  case 'gdrill':return startDrill2(t.dataset.id);
  case 'gwrong':return startDrill2(t.dataset.id,true);
  case 'gwrongall':return startDrill2((S.gwrong[0]||{}).mod,'all');
  case 'gchat':case 'gcall':{closeSheet();const s2=newSession('g:'+t.dataset.id);go('chatv');if(a==='gcall'){freshAudio();return enterCall()}return runAI(s2,openerFor(s2,false))}
  case 'gagain':{const id=(s.scene||'').slice(2);const s2=newSession('g:'+id);go('chatv');return runAI(s2,openerFor(s2,false))}
  case 'gsub':return drillSubmit(false);
  case 'gskip':return drillSubmit(true);
  case 'gnext':GD.i++;return drillItem();
  case 'gmic':return drillMic();
  case 'play':return speak(m.text,false,sceneVoices(s).main);
  case 'slow':return speak(m.text,true,sceneVoices(s).main);
  case 'pcoach':return speak(t.closest('.coach').dataset.coach,false,sceneVoices(s).coach);
  case 'sprop':{const sc=SCENE_BY[t.dataset.id];return sheet(sheetHead(PROP_NAME[sc.prop.type]||'道具')+propHTML(sc.prop)+'<button class="btn g" data-a="close" style="margin-top:10px">回到对话</button>')}
  case 'sbrief':return sceneIntro(t.dataset.id,true);
  case 'sagain':return startLesson(t.dataset.id,false);
  case 'sresume':S.cur=t.dataset.sid;save();return go('chatv');
  case 'reveal':if(m&&!m.shown&&S.cfg.blurEn){m.shown=true;t.classList.remove('blur');save()}return;
  case 'zh':{if(m.zh){m.zhOn=!zhShown(m);save();return renderChat()}t.textContent='翻译中…';try{await ensureZh(m);m.zhOn=true;save()}catch(err){toast(err.message,4000)}return renderChat()}
  case 'ex':return openExplain(m.text);
  case 'sh':{const lk=t.closest('[data-lk]');if(lk){S.lk=S.lk||{};S.lk[lk.dataset.lk]=(S.lk[lk.dataset.lk]||0)+1;save()}return card?openShadow(card.dataset.en,card.dataset.zh):openShadow(m.text,m.zh)}
  case 'favm':addBook({en:m.text,zh:m.zh});return renderChat();
  case 'p':return speak(card.dataset.en);
  case 'pf':return speak(t.dataset.en);
  case 'fav':{const on=addBook({en:card.dataset.en,zh:card.dataset.zh,note:card.dataset.note});t.classList.toggle('on',!!on);return}
  case 'retry':{if(!s)return;s.msgs=s.msgs.filter(x=>x.role!=='err');save();return runAI(s)}
  case 'toset':return go('mev');
  case 'new':{closeSheet();const c=curSess();if(!(c&&!c.msgs.length))newSession();return go('chatv')}
  case 'level':{const ks=Object.keys(LEVELS);S.cfg.level=ks[(ks.indexOf(S.cfg.level)+1)%ks.length];save();renderHeader('chatv');return toast('难度：'+LEVELS[S.cfg.level].n+'（从下一句开始生效）')}
  case 'hint':return openHint();
  case 'review':return openReview();
  case 'call':return enterCall();
  case 'addall':{const o=sheet.review;if(!o)return;let n=0;o.fix.forEach(f=>{if(!inBook(f.to)){addBook({en:f.to,zh:'改地道：'+f.from,note:f.why},true);n++}});o.say.forEach(x=>{if(!inBook(x.en)){addBook(x,true);n++}});document.querySelectorAll('#sheet .say [data-a=fav]').forEach(b=>b.classList.add('on'));toast(`收藏了 ${n} 条`);return}

  case 'custgo':{const v=($('#cust').value||'').trim();if(!v)return toast('写一句场景描述');return startLesson('custom',false,v)}
  case 'sp':return speak(sheet.shadow.en);
  case 'sps':return speak(sheet.shadow.en,true);
  case 'srec':return doShadow();
  case 'drill':return startDrill();
  case 'dshow':drill.show=true;$('#sw').style.filter='';return speak(sheet.shadow.en);
  case 'dok':return drillMark(true);
  case 'dno':return drillMark(false);
  case 'bdel':{const id=t.closest('[data-id]').dataset.id;S.book=S.book.filter(b=>b.id!==id);save();return renderBook()}
  case 'open':{S.cur=t.closest('[data-sid]').dataset.sid;save();return go('chatv')}
  case 'sdel':{const id=t.closest('[data-sid]').dataset.sid;if(!confirm('删除这段对话？'))return;S.sessions=S.sessions.filter(x=>x.id!==id);if(S.cur===id)S.cur=null;save();return renderMe()}
  case 'test':{readCfg();toast('连接中…',8000);try{if(aliKey())await detectAli();const r=await askAI('Reply with exactly: OK','ping');toast('连接成功：'+(S.cfg.model[S.cfg.prov])+' 回复 '+r.trim().slice(0,20),3500);renderMe()}catch(err){toast(err.message,5000)}return}
  case 'models':{readCfg();try{
   if(S.cfg.prov==='qwen')await detectAli();
   const all=(await listModels()).sort(),rec=(FAST[S.cfg.prov]||[]).filter(([id])=>all.includes(id));
   const rest=all.filter(id=>!rec.some(([r])=>r===id)).map(id=>[id,'']);
   sheet(sheetHead('选择模型')+(rec.length?'<div class="note">前几个是推荐的，实测首字最快约 1.4 秒</div>':'')+rec.concat(rest).map(([id,tip])=>`<button class="row" style="width:100%;text-align:left" data-a="pickm" data-m="${esc(id)}"><div class="t"><div>${esc(id)}${id===S.cfg.model[S.cfg.prov]?' ✓':''}</div>${tip?`<small>${tip}</small>`:''}</div></button>`).join(''));
  }catch(err){toast(err.message,5000)}return}
  case 'pickm':S.cfg.model[S.cfg.prov]=t.dataset.m;save();closeSheet();renderMe();return toast('已选择 '+t.dataset.m);
  case 'testv':return speak(t.textContent);
  case 'export':{const d=structuredClone(S);d.cfg.keys={};d.cfg.oaiKey='';d.cfg.aliKey='';const name='口语陪练备份-'+today()+'.json';const file=new File([JSON.stringify(d)],name,{type:'application/json'});
   if(navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file]}).catch(()=>{});return}
   const u=URL.createObjectURL(file);const l=document.createElement('a');l.href=u;l.download=name;document.body.appendChild(l);l.click();l.remove();return}
  case 'import':return $('#impf').click();
 }
});
document.body.addEventListener('input',e=>{if(e.target.id==='vsearch')return vocSearch(e.target.value);if(e.target.id==='search'){renderBook.q=e.target.value;const p=e.target.selectionStart;renderBook();const n=$('#search');n.focus();n.setSelectionRange(p,p)}});
function readCfg(){
 const g=id=>{const el=$('#'+id);return el?el.value.trim():null};
 const k=g('c-key');if(k!==null)S.cfg.keys[S.cfg.prov]=cleanKey(k);
 const m=g('c-model');if(m!==null)S.cfg.model[S.cfg.prov]=m;
 const b=g('c-base');if(b!==null)S.cfg.base=b;
 const ok=$('#c-okey');if(ok&&!ok.disabled)S.cfg.oaiKey=cleanKey(ok.value);
 const ak=$('#c-akey');if(ak&&!ak.disabled)S.cfg.aliKey=cleanKey(ak.value);
 save();
}
$('#mev').addEventListener('change',e=>{
 const id=e.target.id;
 if(id==='c-prov'){readCfg();S.cfg.prov=e.target.value;save();updLangBtn();return renderMe()}
 if(id==='c-key'){readCfg();updLangBtn();renderMe();if(S.cfg.prov==='qwen'&&aliKey()){S.cfg.model.qwen='';detectAli().then(renderMe,err=>toast(err.message,4000))}return}
 if(['c-model','c-base'].includes(id))return readCfg();
 if(['c-okey','c-akey'].includes(id)){readCfg();updLangBtn();renderMe();if(id==='c-akey'&&aliKey())detectAli().then(renderMe,err=>toast(err.message,4000));return}
 if(id==='c-tts'||id==='c-asr'){S.cfg[id.slice(2)]=e.target.value;save();updLangBtn();renderMe();
  const want=e.target.value,got=id==='c-tts'?ttsEngine():asrEngine();
  if(want!=='auto'&&want!==got)toast((want==='ali'?'先填阿里云百炼密钥':want==='openai'?'先填 OpenAI 密钥':'这个浏览器不支持系统识别')+'，现在用的是'+(got?ENG_NAME[got]:'无'),3500);return}
 if(id==='c-avoice'){S.cfg.aliVoice=e.target.value;save();return speak('Hi, this is how I sound.')}
 if(id==='c-voice'){S.cfg.sysVoice=e.target.value;save();return speak('Hi, this is how I sound.')}
 if(id==='c-ovoice'){S.cfg.oaiVoice=e.target.value;save();return speak('Hi, this is how I sound.')}
 if(id==='c-auto')S.cfg.autoplay=e.target.checked;
 if(id==='c-zh')S.cfg.showZh=e.target.checked;
 if(id==='c-blur')S.cfg.blurEn=e.target.checked;
 if(id==='c-sayfix')S.cfg.sayFix=e.target.checked;
 if(id==='c-lk')S.cfg.lkOn=e.target.checked;
 if(id==='c-autolisten')S.cfg.autoListen=e.target.checked;
 save();
});
$('#mev').addEventListener('input',e=>{if(e.target.id==='c-rate'){S.cfg.rate=+e.target.value;$('#ratev').textContent=S.cfg.rate.toFixed(2);save()}});
$('#mev').addEventListener('click',e=>{
 const b=e.target.closest('.seg button');if(!b)return;const seg=b.parentElement.id;
 if(seg==='c-level')S.cfg.level=b.dataset.v;
 if(seg==='c-pause')S.cfg.pause=b.dataset.v;
 if(seg==='c-send')S.cfg.send=b.dataset.v;
 save();renderMe();
});
$('#impf').onchange=async e=>{
 const f=e.target.files[0];if(!f)return;
 try{const d=JSON.parse(await f.text());if(!d||!Array.isArray(d.sessions)||!Array.isArray(d.book))throw 0;
  if(!confirm(`恢复备份：${d.sessions.length} 段对话、${d.book.length} 条表达。当前数据会被替换（密钥保留），继续？`))return;
  const keep={keys:S.cfg.keys,oaiKey:S.cfg.oaiKey};S=Object.assign(structuredClone(DEF),d);S.cfg=Object.assign(structuredClone(DEF.cfg),d.cfg||{},keep);save();toast('已恢复');renderMe();
 }catch(err){toast('这不是口语陪练的备份文件')}
 e.target.value='';
};
document.addEventListener('visibilitychange',()=>{if(document.hidden){if(REC)REC.abort();stopSpeak();lastAct=0}});

if(!S.cur||!curSess()){const s=S.sessions.find(x=>x.msgs.length===0);S.cur=s?s.id:null}
go('chatv');
/* 预热连接：打开或切回应用时先和服务器握好手，第一句话就不用等建连 */
let warmAt=0;
function warm(){
 if(!apiKey()&&!aliKey())return;const n=Date.now();if(n-warmAt<60000)return;warmAt=n;
 (aliKey()&&!S.cfg.aliRoot?detectAli():Promise.resolve()).catch(()=>{}).then(()=>{
  if(apiKey())fetch(base()+'/models',{headers:authHeaders()}).catch(()=>{});
  if(aliKey()&&base().indexOf(aliRoot())!==0)fetch(aliRoot()+'/compatible-mode/v1/models',{headers:{authorization:'Bearer '+aliKey()}}).catch(()=>{});
 });
}
warm();document.addEventListener('visibilitychange',()=>{if(!document.hidden)warm()});
if('serviceWorker' in navigator)navigator.serviceWorker.register('/talk/sw.js',{scope:'/talk/'}).catch(()=>{});
</script>
